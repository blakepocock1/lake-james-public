<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scheduled Visits | Lake James Canopies</title><link rel="stylesheet" href="/style.css"><style>body{background:#f4f4f2}.hidden{display:none!important}.wrap{max-width:1000px;margin:34px auto;padding:20px}.panel,.visit{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin:12px 0}.top,.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#667085;font-size:13px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#e9eef3;font-size:11px;font-weight:800}.login{max-width:430px;margin:80px auto;padding:28px;background:#fff;border:1px solid #ddd;border-radius:12px}.msg{display:none;padding:10px;border-radius:8px;background:#fdebea;color:#b42318}</style></head><body><div id="login" class="login"><h1>Lake James Canopies</h1><p>Customer Scheduled Visits</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin" class="btn">Sign In</button><div id="loginerr" class="msg"></div></div><main id="app" class="wrap hidden"><div class="top"><div><h1 id="org">Scheduled Visits</h1><p class="muted">Upcoming inspections, service visits and scheduled work.</p></div><div><a class="btn secondary" href="/portal/">Back to Portal</a> <button id="refresh" class="btn secondary">Refresh</button> <button id="signout" class="btn secondary">Sign Out</button></div></div><section class="panel"><div class="row"><div><b id="count">0</b> upcoming visits</div><select id="location"><option value="">All locations</option></select></div></section><div id="visits"></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij',{auth:{persistSession:true}}),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));let events=[];function show(t){$('loginerr').textContent=t;$('loginerr').style.display='block'}async function boot(){const u=(await sb.auth.getUser()).data.user;if(!u)return;const p=await sb.from('profiles').select('organization_id,role,organizations(name)').eq('id',u.id).single();if(!p.data?.organization_id){await sb.auth.signOut();return show('Customer account link required.')} $('org').textContent=(p.data.organizations?.name||'Customer')+' Scheduled Visits';$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}$('signin').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return show(r.error.message);boot()};$('signout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refresh').onclick=load;$('location').onchange=render;async function load(){const r=await sb.from('dispatch_calendar').select('*').eq('customer_visible',true).gte('starts_at',new Date().toISOString()).order('starts_at');if(r.error)return show(r.error.message);events=r.data||[];const ls=[...new Map(events.map(x=>[x.location_id,{id:x.location_id,name:(x.location_code||'')+' '+(x.location_name||'')}])).values()];$('location').innerHTML='<option value="">All locations</option>'+ls.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');render()}function render(){const f=$('location').value,rows=events.filter(x=>!f||x.location_id===f);$('count').textContent=rows.length;$('visits').innerHTML=rows.map(x=>{const s=new Date(x.starts_at),e=x.ends_at?new Date(x.ends_at):null,addr=[x.address,x.city,x.state,x.postal_code].filter(Boolean).join(', ');return `<article class="visit"><div class="top"><div><b>${s.toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'})}</b><div>${s.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}${e?' – '+e.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):''}</div></div><span class="badge">${esc(x.status)}</span></div><h3>${esc(x.title)}</h3><p>${esc(x.location_code||'')} ${esc(x.location_name||'')}</p><p class="muted">${esc(addr)}</p></article>`}).join('')||'<div class="panel">No upcoming customer-visible visits are scheduled.</div>'}boot();</script></body></html>
