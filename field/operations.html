<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Field Operations | Lake James Canopies</title><link rel="stylesheet" href="/style.css"><style>body{background:#f2f2ef}.shell{max-width:760px;margin:auto;padding:14px 14px 110px}.hidden{display:none!important}.panel{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 4px 18px rgba(0,0,0,.05)}.login{max-width:420px;margin:50px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-weight:950;letter-spacing:.7px}.muted{color:#6b6b6b;font-size:13px}.job{font-size:24px;margin:6px 0}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e9e9e6;font-size:11px;font-weight:900}.green{background:#dcf4df}.yellow{background:#fff0bd}.red{background:#ffd9d5}.needs_data{background:#e5e9f1}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:fixed;left:14px;right:14px;bottom:10px;max-width:732px;margin:auto;background:#111;padding:8px;border-radius:12px;z-index:20}.tabs button{background:#242424;color:#fff;border:0;border-radius:8px;padding:11px 5px;font-weight:800;font-size:11px}.tabs button.active{background:#fff;color:#111}.section{display:none}.section.active{display:block}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #ddd;border-radius:8px;margin:8px 0}.check input{width:auto;margin:0}.btn.full{width:100%;margin:6px 0}.listitem{border-top:1px solid #eee;padding:10px 0}.listitem:first-child{border-top:0}.small{font-size:12px}.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photoGrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}@media(max-width:500px){.two{grid-template-columns:1fr}h1{font-size:28px}}</style></head><body><div id="login" class="panel login"><h1>Lake James Field</h1><p>Mobile foreman workflow</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin" class="btn full">Sign In</button><p id="loginerr"></p></div><main id="app" class="shell hidden"><div class="top"><div><div class="logo">LAKE JAMES CANOPIES</div><div class="muted">Field Operations</div></div><button id="signout" class="btn secondary">Sign Out</button></div><div class="panel"><label>Project</label><select id="project"></select><div id="jobmeta"></div></div><section id="today" class="section active"><div class="panel"><h2>Today</h2><div class="two"><div><label>Crew / Foreman</label><input id="foreman" placeholder="Foreman name"></div><div><label>Crew count</label><input id="crewcount" type="number" min="0" inputmode="numeric"></div><div><label>Labor hours</label><input id="hours" type="number" min="0" step="0.25" inputmode="decimal"></div><div><label>Weather</label><input id="weather" placeholder="Clear / rain / wind"></div></div><label class="check"><input id="jha" type="checkbox"> JHA / pre-task safety review completed</label><label>Work completed today</label><textarea id="completed"></textarea><label>Plan for next work day</label><textarea id="next"></textarea><label>Delay / constraint</label><textarea id="delay"></textarea><div class="two"><label class="check"><input id="materialIssue" type="checkbox"> Material issue</label><label class="check"><input id="equipmentIssue" type="checkbox"> Equipment issue</label><label class="check"><input id="customerIssue" type="checkbox"> Customer issue</label><label class="check"><input id="safetyIncident" type="checkbox"> Safety incident</label></div><label>Notes</label><textarea id="notes"></textarea><button id="saveReport" class="btn full">Save Daily Report</button><p id="reportmsg" class="muted"></p></div><div class="panel"><h2>Project photos</h2><label>Photo type</label><select id="photoType"><option>PROGRESS</option><option>MATERIAL</option><option>ISSUE</option><option>SAFETY</option><option>PUNCH</option><option>COMPLETION</option></select><input id="photo" type="file" accept="image/*" capture="environment"><input id="caption" placeholder="Caption"><button id="uploadPhoto" class="btn full">Upload Photo</button><div id="photos" class="photoGrid"></div></div></section><section id="issues" class="section"><div class="panel"><h2>Report issue</h2><div class="two"><div><label>Type</label><select id="issueType"><option>MATERIAL</option><option>EQUIPMENT</option><option>SAFETY</option><option>QUALITY</option><option>CUSTOMER</option><option>SCHEDULE</option><option>SCOPE</option><option>OTHER</option></select></div><div><label>Severity</label><select id="severity"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select></div></div><textarea id="issueDesc" placeholder="Describe the problem and what is needed"></textarea><button id="addIssue" class="btn full">Add Issue</button></div><div class="panel"><h2>Open issues</h2><div id="issueList"></div></div></section><section id="changes" class="section"><div class="panel"><h2>Change request</h2><textarea id="changeDesc" placeholder="Describe changed or added work"></textarea><input id="changeReason" placeholder="Reason / customer request / unforeseen condition"><div class="two"><input id="changeCost" type="number" step="0.01" placeholder="Estimated cost"><input id="changePrice" type="number" step="0.01" placeholder="Estimated sell price"></div><button id="addChange" class="btn full">Send to PM Review</button></div><div class="panel"><h2>Pending changes</h2><div id="changeList"></div></div></section><section id="closeout" class="section"><div class="panel"><h2>Punch list</h2><textarea id="punchDesc" placeholder="Add punch item"></textarea><button id="addPunch" class="btn full">Add Punch Item</button><div id="punchList"></div></div><div class="panel"><h2>Finish field work</h2><p>Submission is blocked while open punch items or high/critical field issues remain.</p><textarea id="completionNotes" placeholder="Completion notes for PM"></textarea><button id="submitPM" class="btn full">Submit Ready for PM Review</button><p id="closemsg" class="muted"></p></div></section><nav class="tabs"><button data-tab="today" class="active">Today</button><button data-tab="issues">Issues</button><button data-tab="changes">Changes</button><button data-tab="closeout">Closeout</button></nav></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij',{auth:{persistSession:true}}),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let projects=[],qid=null;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});async function boot(){const u=(await sb.auth.getUser()).data.user;if(!u)return;const p=await sb.from('profiles').select('role').eq('id',u.id).single();if(p.data?.role!=='admin'){await sb.auth.signOut();$('loginerr').textContent='Field access has not been assigned to this account.';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');await loadProjects()}$('signin').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)$('loginerr').textContent=r.error.message;else boot()};$('signout').onclick=async()=>{await sb.auth.signOut();location.reload()};async function loadProjects(){const r=await sb.from('field_operations_project_status').select('*').order('quote_number');if(r.error)return alert(r.error.message);projects=r.data||[];$('project').innerHTML=projects.map(x=>`<option value="${x.canopy_quote_id}">${esc(x.quote_number||'No #')} — ${esc(x.quote_name||x.customer_name||'Project')} [${esc(x.record_type)}]</option>`).join('')||'<option>No projects</option>';qid=projects[0]?.canopy_quote_id||null;$('project').onchange=async()=>{qid=$('project').value;renderMeta();await loadAll()};renderMeta();await loadAll()}function renderMeta(){const x=projects.find(p=>p.canopy_quote_id===qid);$('jobmeta').innerHTML=x?`<h1 class="job">${esc(x.quote_name||x.customer_name||'Project')}</h1><span class="badge ${String(x.field_health||'').toLowerCase()}">${esc(x.field_health)}</span> <span class="badge">${esc(x.project_stage)}</span><p class="muted">${esc(x.customer_name||'')} · ${esc(x.quote_number||'')}</p>`:''}async function loadAll(){if(!qid)return;await Promise.all([loadIssues(),loadChanges(),loadPunch(),loadPhotos(),loadToday()])}async function loadToday(){const d=new Date().toISOString().slice(0,10),r=await sb.from('field_daily_reports').select('*').eq('canopy_quote_id',qid).eq('report_date',d).maybeSingle();const x=r.data;if(!x)return;$('foreman').value=x.foreman_name||'';$('crewcount').value=x.crew_count??'';$('hours').value=x.labor_hours??'';$('weather').value=x.weather||'';$('jha').checked=!!x.jha_completed;$('completed').value=x.work_completed||'';$('next').value=x.work_planned_next||'';$('delay').value=x.delay_reason||'';$('materialIssue').checked=!!x.material_issue;$('equipmentIssue').checked=!!x.equipment_issue;$('customerIssue').checked=!!x.customer_issue;$('safetyIncident').checked=!!x.safety_incident;$('notes').value=x.notes||''}$('saveReport').onclick=async()=>{if(!qid)return;const row={canopy_quote_id:qid,report_date:new Date().toISOString().slice(0,10),foreman_name:$('foreman').value||null,crew_count:Number($('crewcount').value)||0,labor_hours:Number($('hours').value)||0,weather:$('weather').value||null,jha_completed:$('jha').checked,work_completed:$('completed').value||null,work_planned_next:$('next').value||null,delay_reason:$('delay').value||null,material_issue:$('materialIssue').checked,equipment_issue:$('equipmentIssue').checked,customer_issue:$('customerIssue').checked,safety_incident:$('safetyIncident').checked,notes:$('notes').value||null};const r=await sb.from('field_daily_reports').upsert(row,{onConflict:'canopy_quote_id,report_date'});$('reportmsg').textContent=r.error?r.error.message:'Daily report saved.';if(!r.error)await loadProjects()};async function loadIssues(){const r=await sb.from('field_issues').select('*').eq('canopy_quote_id',qid).order('created_at',{ascending:false});$('issueList').innerHTML=(r.data||[]).filter(x=>!['RESOLVED','CLOSED'].includes(x.status)).map(x=>`<div class="listitem"><b>${esc(x.severity)} · ${esc(x.issue_type)}</b><div>${esc(x.description)}</div><button class="btn secondary" onclick="resolveIssue('${x.id}')">Resolve</button></div>`).join('')||'<p class="muted">No open issues.</p>'}window.resolveIssue=async id=>{await sb.from('field_issues').update({status:'RESOLVED',resolved_at:new Date().toISOString()}).eq('id',id);loadIssues()};$('addIssue').onclick=async()=>{const r=await sb.from('field_issues').insert({canopy_quote_id:qid,issue_type:$('issueType').value,severity:$('severity').value,description:$('issueDesc').value});if(r.error)alert(r.error.message);else{$('issueDesc').value='';loadIssues()}};async function loadChanges(){const r=await sb.from('field_change_requests').select('*').eq('canopy_quote_id',qid).order('created_at',{ascending:false});$('changeList').innerHTML=(r.data||[]).map(x=>`<div class="listitem"><b>${esc(x.status)}</b><div>${esc(x.description)}</div><span class="small">${esc(x.reason||'')}</span></div>`).join('')||'<p class="muted">No change requests.</p>'}$('addChange').onclick=async()=>{const r=await sb.from('field_change_requests').insert({canopy_quote_id:qid,description:$('changeDesc').value,reason:$('changeReason').value||null,estimated_cost:Number($('changeCost').value)||null,estimated_price:Number($('changePrice').value)||null,status:'PM_REVIEW'});if(r.error)alert(r.error.message);else{$('changeDesc').value='';$('changeReason').value='';loadChanges()}};async function loadPunch(){const r=await sb.from('field_punch_items').select('*').eq('canopy_quote_id',qid).order('created_at');$('punchList').innerHTML=(r.data||[]).filter(x=>!['COMPLETE','WAIVED'].includes(x.status)).map(x=>`<div class="listitem"><div>${esc(x.description)}</div><button class="btn secondary" onclick="completePunch('${x.id}')">Complete</button></div>`).join('')||'<p class="muted">No open punch items.</p>'}window.completePunch=async id=>{await sb.from('field_punch_items').update({status:'COMPLETE',completed_at:new Date().toISOString()}).eq('id',id);loadPunch()};$('addPunch').onclick=async()=>{const r=await sb.from('field_punch_items').insert({canopy_quote_id:qid,description:$('punchDesc').value});if(r.error)alert(r.error.message);else{$('punchDesc').value='';loadPunch()}};$('submitPM').onclick=async()=>{const r=await sb.rpc('submit_field_completion_for_pm',{p_quote_id:qid,p_notes:$('completionNotes').value||null});$('closemsg').textContent=r.error?r.error.message:'Submitted to PM review.'};$('uploadPhoto').onclick=async()=>{const f=$('photo').files[0];if(!f)return alert('Choose a photo.');const path=`${qid}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await sb.storage.from('field-photos').upload(path,f);if(up.error)return alert(up.error.message);const ins=await sb.from('field_photos').insert({canopy_quote_id:qid,storage_path:path,caption:$('caption').value||null,photo_type:$('photoType').value});if(ins.error)return alert(ins.error.message);$('photo').value='';$('caption').value='';loadPhotos()};async function loadPhotos(){const r=await sb.from('field_photos').select('*').eq('canopy_quote_id',qid).order('created_at',{ascending:false}).limit(12),items=r.data||[];const urls=await Promise.all(items.map(async x=>{const s=await sb.storage.from('field-photos').createSignedUrl(x.storage_path,3600);return{...x,url:s.data?.signedUrl}}));$('photos').innerHTML=urls.filter(x=>x.url).map(x=>`<img src="${x.url}" alt="${esc(x.caption||x.photo_type)}" title="${esc(x.caption||x.photo_type)}">`).join('')}boot();</script></body></html>
