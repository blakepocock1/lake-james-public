<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Schedule | Lake James</title><link rel="stylesheet" href="/style.css"><style>body{background:#f4f4f2}.hidden{display:none!important}.wrap{max-width:900px;margin:30px auto;padding:18px}.panel,.visit{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin:12px 0}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.visit.today{border-left:5px solid #26362d}.muted{color:#667085;font-size:13px}.badge{padding:4px 8px;border-radius:99px;background:#e9eef3;font-size:11px;font-weight:800}.msg{display:none;padding:10px;border-radius:8px;background:#e8f7ef;color:#18794e}.err{background:#fdebea;color:#b42318}.login{max-width:430px;margin:80px auto;padding:28px;background:#fff;border:1px solid #ddd;border-radius:12px}</style></head><body><div id="login" class="login"><h1>Lake James Field</h1><p>My Schedule</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin" class="btn">Sign In</button><div id="loginerr" class="msg err"></div></div><main id="app" class="wrap hidden"><div class="top"><div><h1>My Schedule</h1><p id="who" class="muted"></p></div><div><a class="btn secondary" href="/field/">Inspection App</a> <button id="refresh" class="btn secondary">Refresh</button> <button id="signout" class="btn secondary">Sign Out</button></div></div><div id="err" class="msg err"></div><section class="panel"><div class="row"><div><b id="count">0</b> upcoming visits</div><div><select id="range"><option value="7">Next 7 days</option><option value="14">Next 14 days</option><option value="30" selected>Next 30 days</option></select></div></div></section><div id="visits"></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij',{auth:{persistSession:true}}),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));let user,events=[];function show(id,t){$(id).textContent=t;$(id).style.display='block';setTimeout(()=>$(id).style.display='none',4000)}async function boot(){user=(await sb.auth.getUser()).data.user;if(!user)return;const p=await sb.from('profiles').select('full_name,role,organizations(name)').eq('id',user.id).single();if(!p.data||p.data.organizations?.name!=='Lake James Canopies'||!['admin','manager','technician'].includes(p.data.role)){await sb.auth.signOut();return show('loginerr','Lake James field access required.')} $('who').textContent=(p.data.full_name||'Field User')+' · '+p.data.role;$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}$('signin').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return show('loginerr',r.error.message);boot()};$('signout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refresh').onclick=load;$('range').onchange=render;async function load(){const r=await sb.from('dispatch_calendar').select('*').eq('assigned_user_id',user.id).gte('starts_at',new Date().toISOString()).order('starts_at');if(r.error)return show('err',r.error.message);events=r.data||[];render()}function render(){const days=Number($('range').value),cut=new Date(Date.now()+days*86400000),rows=events.filter(x=>new Date(x.starts_at)<=cut);$('count').textContent=rows.length;$('visits').innerHTML=rows.map(x=>{const s=new Date(x.starts_at),today=s.toDateString()===new Date().toDateString(),addr=[x.address,x.city,x.state,x.postal_code].filter(Boolean).join(', '),open=x.event_type==='inspection'?`<a class="btn" href="/field/?inspection=${x.source_id}">Open Inspection</a>`:'';return `<article class="visit ${today?'today':''}"><div class="top"><div><b>${s.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})} · ${s.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</b><div class="muted">${esc(x.customer_name||'')} · ${esc(x.location_code||'')} ${esc(x.location_name||'')}</div></div><span class="badge">${esc(x.status)}</span></div><h3>${esc(x.title)}</h3><p>${esc(addr)}</p><p class="muted">${esc(x.notes||'')}</p><div class="row"><span>${esc(x.event_type.replace('_',' '))}</span>${open}</div></article>`}).join('')||'<div class="panel">No upcoming assigned visits.</div>'}boot();</script><script type="module" src="/site-manager.js"></script></body></html>
