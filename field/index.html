<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field Inspection | Lake James Canopies</title><link rel="stylesheet" href="/style.css"><style>body{background:#f4f4f2;margin:0}.shell{max-width:760px;margin:auto;padding:16px}.card{background:#fff;padding:16px;border:1px solid #ddd;border-radius:12px;margin:12px 0}.hidden{display:none}.item{border-top:1px solid #eee;padding:14px 0}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.choice{padding:12px 4px}.choice.active{font-weight:900;background:#ddd}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;font-size:16px}.photo{width:100%;margin:8px 0}.sticky{position:sticky;bottom:0;background:#fff;padding:10px;display:flex;gap:8px}.sticky button{flex:1}@media(max-width:520px){.choices{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="shell"><div id="login" class="card"><h1>Lake James Field Inspection</h1><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin" class="btn">Sign In</button><p id="loginerr"></p></div><main id="app" class="hidden"><div class="card"><b>Lake James Canopies</b><button id="signout" class="btn secondary" style="float:right">Sign Out</button><h1>Field Inspection</h1><p id="who"></p></div><div id="chooser" class="card"><h2>Start Inspection</h2><select id="location"></select><input id="inspectorName" placeholder="Inspector name"><button id="start" class="btn">Start Standard Inspection</button><h3>Assigned / Open Inspections</h3><div id="open"></div></div><section id="editor" class="hidden"><div class="card"><h2 id="site"></h2><p id="address"></p><b>Health Score: <span id="score">—</span></b></div><div id="checklist" class="card"></div><div class="card"><h2>Photos</h2><input id="caption" placeholder="Photo caption"><input id="photos" type="file" accept="image/*" capture="environment" multiple><div id="photoList"></div></div><div class="card"><h2>Notes & Recommendations</h2><textarea id="notes" rows="4" placeholder="Inspection notes"></textarea><textarea id="recommendations" rows="4" placeholder="Recommendations"></textarea><button id="save" class="btn secondary">Save Notes</button></div><div class="card"><h2>Inspector Sign-Off</h2><p>Enter your name to certify the inspection record.</p><input id="signatureName" placeholder="Inspector signature / typed name"></div><div class="sticky"><button id="back" class="btn secondary">Back</button><button id="complete" class="btn">Complete Inspection</button></div></section><p id="notice"></p></main></div><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';
const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij',{auth:{persistSession:true}}),$=x=>document.getElementById(x);
let user,profile,locations=[],inspection,items=[];
const template=[['Structure','Columns / base plates'],['Structure','Main beams / purlins'],['Fascia','Fascia panels / attachments'],['Fascia','Soffit / trim'],['Drainage','Gutters / internal drainage'],['Drainage','Downspouts / discharge'],['Lighting','Fixtures / lenses'],['Lighting','Electrical appearance'],['Appearance','Paint / corrosion'],['Appearance','Branding / overall appearance']];
const name=l=>`${l.location_code||''} ${l.name||''}`.trim();
function say(t){$('notice').textContent=t||'';if(t)window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
async function boot(){user=(await sb.auth.getUser()).data.user;if(!user)return;const r=await sb.from('profiles').select('*').eq('id',user.id).single();if(r.error||!['admin','technician','inspector'].includes(r.data?.role)){await sb.auth.signOut();$('loginerr').textContent='Lake James field access required.';return}profile=r.data;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=profile.full_name||user.email;$('inspectorName').value=profile.full_name||'';await chooser();const requested=new URLSearchParams(location.search).get('inspection');if(requested)await openInspection(requested)}
$('signin').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)$('loginerr').textContent=r.error.message;else boot()};
$('signout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function chooser(){const [l,i]=await Promise.all([sb.from('locations').select('*').order('location_code'),sb.from('inspections').select('*').in('status',['scheduled','in_progress']).order('inspected_at',{ascending:false})]);if(l.error||i.error)return say((l.error||i.error).message);locations=l.data||[];$('location').innerHTML=locations.map(x=>`<option value="${x.id}">${name(x)} — ${x.city||''}, ${x.state||''}</option>`).join('');$('open').innerHTML=(i.data||[]).map(x=>`<button class="btn secondary resume" data-id="${x.id}" style="width:100%;margin:4px 0">${name(locations.find(y=>y.id===x.location_id)||{})} — ${x.status}</button>`).join('')||'None';document.querySelectorAll('.resume').forEach(b=>b.onclick=()=>openInspection(b.dataset.id))}
$('start').onclick=async()=>{say('Starting inspection…');const r=await sb.from('inspections').insert({location_id:$('location').value,technician_id:user.id,inspected_at:new Date().toISOString(),status:'in_progress',inspector_name:$('inspectorName').value||profile.full_name||user.email}).select().single();if(r.error)return say('Could not start inspection: '+r.error.message);const c=await sb.from('inspection_checklist_items').insert(template.map(([category,item])=>({inspection_id:r.data.id,category,item,condition:'good'})));if(c.error)return say('Inspection created, but checklist failed: '+c.error.message);await openInspection(r.data.id)};
async function openInspection(id){say('Loading inspection…');const [i,c]=await Promise.all([sb.from('inspections').select('*').eq('id',id).single(),sb.from('inspection_checklist_items').select('*').eq('inspection_id',id).order('created_at')]);if(i.error||c.error)return say('Could not load inspection: '+(i.error||c.error).message);inspection=i.data;if(inspection.status==='scheduled'){const started=await sb.from('inspections').update({status:'in_progress',inspected_at:inspection.inspected_at||new Date().toISOString(),inspector_name:inspection.inspector_name||profile.full_name||user.email}).eq('id',inspection.id).select().single();if(started.error)return say('Could not start assigned inspection: '+started.error.message);inspection=started.data}items=c.data||[];if(!items.length){const seeded=await sb.from('inspection_checklist_items').insert(template.map(([category,item])=>({inspection_id:inspection.id,category,item,condition:'good'}))).select();if(seeded.error)return say('Could not create checklist: '+seeded.error.message);items=seeded.data||[]} $('chooser').classList.add('hidden');$('editor').classList.remove('hidden');const l=locations.find(x=>x.id===inspection.location_id);$('site').textContent=name(l||{});$('address').textContent=l?[l.address,l.city,l.state,l.postal_code].filter(Boolean).join(', '):'';$('notes').value=inspection.notes||'';$('recommendations').value=inspection.recommendations||'';$('signatureName').value=inspection.inspector_name||profile.full_name||'';render();await loadPhotos();say('Inspection ready. Changes save directly to the facility record.')}
function render(){$('score').textContent=inspection.overall_score??'—';$('checklist').innerHTML='<h2>Canopy Checklist</h2>'+items.map(x=>`<div class="item" data-id="${x.id}"><small>${x.category}</small><h3>${x.item}</h3><div class="choices">${[['good','Good'],['attention','Attention'],['critical','Critical'],['not_applicable','N/A']].map(([v,t])=>`<button class="choice ${x.condition===v?'active':''}" data-v="${v}">${t}</button>`).join('')}</div><textarea rows="2" placeholder="Notes">${x.notes||''}</textarea></div>`).join('');document.querySelectorAll('.item').forEach(el=>{el.querySelectorAll('.choice').forEach(b=>b.onclick=async()=>{const r=await sb.from('inspection_checklist_items').update({condition:b.dataset.v}).eq('id',el.dataset.id).select('id').single();if(r.error)return say('Checklist save failed: '+r.error.message);items.find(x=>x.id===el.dataset.id).condition=b.dataset.v;await refresh()});el.querySelector('textarea').onchange=async e=>{const r=await sb.from('inspection_checklist_items').update({notes:e.target.value||null}).eq('id',el.dataset.id).select('id').single();if(r.error)say('Checklist note save failed: '+r.error.message)}})}
async function refresh(){const r=await sb.from('inspections').select('*').eq('id',inspection.id).single();if(!r.error){inspection=r.data;render()}}
async function saveNotes(){const r=await sb.from('inspections').update({notes:$('notes').value||null,recommendations:$('recommendations').value||null}).eq('id',inspection.id).select('id').single();if(r.error){say('Notes save failed: '+r.error.message);return false}return true}
$('save').onclick=async()=>{if(await saveNotes())say('Notes saved.')};
$('photos').onchange=async e=>{if(!inspection)return say('Open an inspection before uploading photos.');const files=[...e.target.files];if(!files.length)return;say(`Uploading ${files.length} photo${files.length===1?'':'s'}…`);let saved=0;for(const file of files){const safe=(file.name||'photo.jpg').replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${inspection.id}/${Date.now()}-${crypto.randomUUID()}-${safe}`;const up=await sb.storage.from('inspection-photos').upload(path,file,{contentType:file.type||'image/jpeg'});if(up.error){say('Photo upload failed: '+up.error.message);continue}const row=await sb.from('inspection_photos').insert({inspection_id:inspection.id,storage_path:path,caption:$('caption').value||null}).select('id').single();if(row.error){await sb.storage.from('inspection-photos').remove([path]);say('Photo record save failed: '+row.error.message);continue}saved++}$('photos').value='';$('caption').value='';await loadPhotos();if(saved===files.length)say(`${saved} photo${saved===1?'':'s'} saved successfully.`)};
async function loadPhotos(){const p=await sb.from('inspection_photos').select('*').eq('inspection_id',inspection.id).order('created_at');if(p.error){say('Could not load photos: '+p.error.message);return 0}$('photoList').innerHTML='';for(const x of p.data||[]){const u=await sb.storage.from('inspection-photos').createSignedUrl(x.storage_path,1800);if(!u.error)$('photoList').insertAdjacentHTML('beforeend',`<img class="photo" src="${u.data.signedUrl}"><small>${x.caption||''}</small>`)}return (p.data||[]).length}
$('complete').onclick=async()=>{if(!inspection)return say('No inspection is open.');if(!$('signatureName').value.trim())return say('Inspector sign-off is required.');const photoCount=await loadPhotos();if(photoCount<1)return say('At least one saved inspection photo is required before completion.');if(!confirm('Complete this inspection and publish the results to the facility record?'))return;say('Completing inspection…');if(!await saveNotes())return;const now=new Date().toISOString();const r=await sb.from('inspections').update({status:'completed',completed_at:now,signed_at:now,inspector_name:$('signatureName').value.trim()}).eq('id',inspection.id).select('id,status,completed_at,signed_at,inspector_name').single();if(r.error)return say('Completion failed: '+r.error.message);if(r.data.status!=='completed'||!r.data.completed_at||!r.data.signed_at)return say('Completion did not persist. Please contact an administrator.');say('Inspection completed and verified. Facility history updated.');$('editor').classList.add('hidden');$('chooser').classList.remove('hidden');await chooser()};
$('back').onclick=()=>{$('editor').classList.add('hidden');$('chooser').classList.remove('hidden');chooser()};
boot();
</script></body></html>
