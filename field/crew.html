<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crew Portal | Lake James Canopies</title><link rel="stylesheet" href="/style.css"><style>body{background:#f3f3f1}.shell{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{width:100%}@media(max-width:520px){.row{grid-template-columns:1fr}}</style></head><body><div class="shell"><div id="login" class="card"><h1>Lake James Crew Portal</h1><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin" class="btn full">Sign In</button><p id="err"></p></div><main id="app" class="hidden"><div class="card"><b>LAKE JAMES CANOPIES</b><button id="signout" class="btn secondary" style="float:right">Sign Out</button><h1>My Projects</h1><p id="who"></p><select id="project"></select></div><div id="work" class="card hidden"><h2 id="title"></h2><div class="row"><input id="crew" type="number" min="0" placeholder="Crew count"><input id="hours" type="number" min="0" step=".25" placeholder="Labor hours"></div><label><input id="jha" type="checkbox"> JHA / pre-task review complete</label><textarea id="done" placeholder="Work completed today"></textarea><textarea id="next" placeholder="Next work day plan"></textarea><button id="save" class="btn full">Save Daily Report</button><hr><h3>Report an Issue</h3><div class="row"><select id="type"><option>MATERIAL</option><option>EQUIPMENT</option><option>SAFETY</option><option>QUALITY</option><option>CUSTOMER</option><option>SCHEDULE</option><option>SCOPE</option><option>OTHER</option></select><select id="severity"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select></div><textarea id="issue" placeholder="Describe the issue"></textarea><button id="addIssue" class="btn full">Submit Issue</button><p id="msg"></p></div></main></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij',{auth:{persistSession:true}}),$=x=>document.getElementById(x);let user,profile,projects=[],qid;async function boot(){user=(await sb.auth.getUser()).data.user;if(!user)return;const p=await sb.from('profiles').select('full_name,role').eq('id',user.id).single();if(p.error||!['admin','manager','project_manager','foreman','technician','service'].includes(p.data?.role)){await sb.auth.signOut();$('err').textContent='Field access has not been assigned.';return}profile=p.data;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=(profile.full_name||user.email)+' · '+profile.role;await loadProjects()}$('signin').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)$('err').textContent=r.error.message;else boot()};$('signout').onclick=async()=>{await sb.auth.signOut();location.reload()};async function loadProjects(){let ids=null;if(profile.role!=='admin'){const a=await sb.from('my_project_access').select('canopy_quote_id');if(a.error)return $('err').textContent=a.error.message;ids=[...new Set((a.data||[]).map(x=>x.canopy_quote_id))]}let q=sb.from('field_operations_project_status').select('canopy_quote_id,quote_number,quote_name,customer_name,project_stage,field_health').order('quote_number');if(ids)q=ids.length?q.in('canopy_quote_id',ids):q.eq('canopy_quote_id','00000000-0000-0000-0000-000000000000');const r=await q;if(r.error)return $('err').textContent=r.error.message;projects=r.data||[];$('project').innerHTML=projects.map(x=>`<option value="${x.canopy_quote_id}">${x.quote_number||'No #'} — ${x.quote_name||x.customer_name||'Project'}</option>`).join('')||'<option>No assigned projects</option>';if(projects.length){qid=projects[0].canopy_quote_id;$('work').classList.remove('hidden');render()}$('project').onchange=()=>{qid=$('project').value;render()}}function render(){const x=projects.find(y=>y.canopy_quote_id===qid);$('title').textContent=x?(x.quote_name||x.customer_name||'Project')+' · '+x.project_stage:''}$('save').onclick=async()=>{if(!qid)return;const row={canopy_quote_id:qid,report_date:new Date().toISOString().slice(0,10),submitted_by:user.id,foreman_name:profile.full_name||user.email,crew_count:Number($('crew').value)||0,labor_hours:Number($('hours').value)||0,jha_completed:$('jha').checked,work_completed:$('done').value||null,work_planned_next:$('next').value||null};const r=await sb.from('field_daily_reports').upsert(row,{onConflict:'canopy_quote_id,report_date'});$('msg').textContent=r.error?r.error.message:'Daily report saved.'};$('addIssue').onclick=async()=>{if(!qid||!$('issue').value.trim())return;const r=await sb.from('field_issues').insert({canopy_quote_id:qid,issue_type:$('type').value,severity:$('severity').value,description:$('issue').value.trim()});$('msg').textContent=r.error?r.error.message:'Issue submitted.';if(!r.error)$('issue').value=''};boot();</script></body></html>
