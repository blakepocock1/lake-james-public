<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Labor Time | Lake James Canopies</title><link rel="stylesheet" href="/style.css"><style>body{background:#f3f3f1;margin:0}.wrap{max-width:850px;margin:auto;padding:20px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:18px;margin:12px 0}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;margin:5px 0}.big{font-size:30px;font-weight:900}.entry{border-top:1px solid #eee;padding:10px 0}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div id="login" class="card"><h1>Lake James Field</h1><h2>Labor Time</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin" class="btn">Sign In</button><p id="err"></p></div><main id="app" class="hidden"><div class="card"><b>LAKE JAMES CANOPIES</b><h1>Work Order Time</h1><a href="/field/">Field App</a> · <a href="/field/schedule.html">Schedule</a> · <button id="out" class="btn secondary">Sign Out</button></div><div class="card"><h2>Add Labor</h2><select id="wo"></select><div class="row"><div><label>Date</label><input id="date" type="date"></div><div><label>Hours</label><input id="hours" type="number" min="0" step=".25" placeholder="8"></div></div><div class="row"><div><label>Hourly company labor cost</label><input id="rate" type="number" min="0" step=".01" placeholder="25.00"></div><div><label>Calculated labor cost</label><div id="cost" class="big">$0.00</div></div></div><textarea id="notes" placeholder="Work performed / notes"></textarea><button id="save" class="btn">Submit Time</button><p id="notice"></p></div><div class="card"><h2>My Recent Time</h2><div id="entries"></div></div></main></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij',{auth:{persistSession:true}}),$=x=>document.getElementById(x);let user,orders=[];const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);$('hours').oninput=$('rate').oninput=()=>{$('cost').textContent=money(Number($('hours').value||0)*Number($('rate').value||0))};async function boot(){user=(await sb.auth.getUser()).data.user;if(!user)return;$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}$('signin').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)$('err').textContent=r.error.message;else boot()};$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};async function load(){const [w,t]=await Promise.all([sb.from('work_orders').select('id,work_order_number,description,organization_id,location_id,canopy_quote_id,status').in('status',['scheduled','in_progress','open']).order('scheduled_at'),sb.from('labor_time_entries').select('*,work_orders(work_order_number,description)').eq('user_id',user.id).order('work_date',{ascending:false}).limit(30)]);orders=w.data||[];$('wo').innerHTML='<option value="">Select work order</option>'+orders.map(x=>`<option value="${x.id}">${x.work_order_number||'Work Order'} — ${x.description||''}</option>`).join('');$('entries').innerHTML=(t.data||[]).map(x=>`<div class="entry"><b>${x.work_date} · ${Number(x.hours).toFixed(2)} hrs · ${money(x.labor_cost)}</b><br>${x.work_orders?.work_order_number||''} ${x.work_orders?.description||''}<br><small>${x.notes||''}</small></div>`).join('')||'No time submitted yet.'}$('save').onclick=async()=>{const w=orders.find(x=>x.id===$('wo').value),hours=Number($('hours').value||0),rate=Number($('rate').value||0);if(!w||hours<=0){$('notice').textContent='Select a work order and enter hours.';return}const r=await sb.from('labor_time_entries').insert({user_id:user.id,work_order_id:w.id,organization_id:w.organization_id,location_id:w.location_id,canopy_quote_id:w.canopy_quote_id,work_date:$('date').value||new Date().toISOString().slice(0,10),hours,hourly_cost:rate,notes:$('notes').value||null,status:'submitted'});$('notice').textContent=r.error?r.error.message:'Time submitted. Labor cost is now included in job profitability.';if(!r.error){$('hours').value='';$('notes').value='';$('cost').textContent='$0.00';load()}};boot();</script></body></html>
