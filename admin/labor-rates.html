<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Labor Rates | Lake James Canopies</title><link rel="stylesheet" href="/style.css"><style>body{background:#f3f3f1;margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin:12px 0}.hidden{display:none}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}input{padding:9px;width:100px}.login{max-width:420px;margin:70px auto}.login input{width:100%;box-sizing:border-box;margin:5px 0}</style></head><body><div id="login" class="card login"><h1>Lake James Admin</h1><p>Labor Rate Management</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin" class="btn">Sign In</button><p id="err"></p></div><main id="app" class="wrap hidden"><div class="card"><b>LAKE JAMES CANOPIES</b><h1>Employee Labor Rates</h1><p>Private company costing. Field employees do not see these rates.</p><a class="btn secondary" href="/admin/job-profitability.html">Job Profitability</a> <button id="out" class="btn secondary">Sign Out</button></div><div class="card"><div style="overflow:auto"><table><thead><tr><th>Employee</th><th>Role</th><th>Base Hourly Rate</th><th>Burden %</th><th>Burdened Cost</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><p id="notice"></p></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij',{auth:{persistSession:true}}),$=x=>document.getElementById(x),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0));async function boot(){const u=(await sb.auth.getUser()).data.user;if(!u)return;const p=await sb.from('profiles').select('role').eq('id',u.id).single();if(p.data?.role!=='admin'){await sb.auth.signOut();$('err').textContent='Administrator access required.';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}$('signin').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)$('err').textContent=r.error.message;else boot()};$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};async function load(){const r=await sb.from('employee_labor_rate_admin').select('*').order('full_name');$('rows').innerHTML=(r.data||[]).map(x=>`<tr><td><b>${x.full_name||'Unnamed user'}</b></td><td>${x.role||''}</td><td><input id="base-${x.user_id}" type="number" step=".01" value="${x.base_hourly_rate??''}"></td><td><input id="burden-${x.user_id}" type="number" step=".01" value="${x.burden_percent??0}"></td><td>${x.burdened_hourly_cost==null?'Not configured':money(x.burdened_hourly_cost)+'/hr'}</td><td><button class="btn" data-id="${x.user_id}">Save</button></td></tr>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>save(b.dataset.id))}async function save(id){const base=Number($('base-'+id).value),burden=Number($('burden-'+id).value);const r=await sb.from('employee_labor_rates').upsert({user_id:id,base_hourly_rate:base,burden_percent:burden,effective_date:new Date().toISOString().slice(0,10),updated_at:new Date().toISOString()});$('notice').textContent=r.error?r.error.message:'Labor rate saved.';if(!r.error)load()}boot();</script></body></html>
