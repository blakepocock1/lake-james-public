<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employees & Crews | LJC</title><link rel="stylesheet" href="/style.css"><style>body{background:#f3f3f0}.wrap{max-width:1100px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #eee}.muted{color:#666;font-size:13px}.hidden{display:none}.badge{padding:4px 8px;background:#eee;border-radius:999px;font-size:11px;font-weight:800}@media(max-width:700px){.grid,.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div id="login" class="panel"><h1>Employee & Crew Admin</h1><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="signin" class="btn">Sign In</button><p id="err"></p></div><main id="app" class="hidden"><div style="display:flex;justify-content:space-between"><div><h1>Employee & Crew Administration</h1><p class="muted">Roles, crews and project staffing</p></div><button id="out" class="btn secondary">Sign Out</button></div><div class="panel"><h2>Create Crew</h2><div class="grid"><input id="crewName" placeholder="Crew name"><select id="crewType"><option>LJC</option><option>SUBCONTRACTOR</option></select><input id="crewSize" type="number" min="1" placeholder="Crew size"></div><button id="createCrew" class="btn">Create Crew</button></div><div class="panel"><h2>Employees</h2><div id="employees"></div></div><div class="panel"><h2>Crews</h2><div id="crews"></div></div><div class="panel"><h2>Project Staffing</h2><div class="grid"><select id="project"></select><select id="person"></select><select id="assignmentRole"><option>PROJECT_MANAGER</option><option>FOREMAN</option><option>TECHNICIAN</option><option>INSPECTOR</option><option>PURCHASING</option><option>ACCOUNTING</option><option>ESTIMATOR</option><option>SALES</option><option>SERVICE</option></select></div><button id="assignPerson" class="btn">Assign Person</button><div class="grid" style="margin-top:12px"><select id="crewProject"></select><select id="crew"></select><select id="fieldStatus"><option>PLANNED</option><option>CONFIRMED</option></select></div><button id="assignCrew" class="btn">Assign Crew</button><div id="projects"></div></div></main></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij'),$=x=>document.getElementById(x),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let employees=[],crews=[],projects=[];async function boot(){const u=(await sb.auth.getUser()).data.user;if(!u)return;const p=await sb.from('profiles').select('role').eq('id',u.id).single();if(p.data?.role!=='admin'){await sb.auth.signOut();$('err').textContent='Administrator access required.';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}$('signin').onclick=async()=>{let r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)$('err').textContent=r.error.message;else boot()};$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};async function load(){const [a,b,c]=await Promise.all([sb.from('employee_crew_admin_directory').select('*').order('full_name'),sb.from('crew_admin_directory').select('*').order('crew_name'),sb.from('project_staffing_admin_queue').select('*').order('quote_number')]);if(a.error||b.error||c.error)return alert((a.error||b.error||c.error).message);employees=a.data||[];crews=b.data||[];projects=c.data||[];render()}function render(){$('employees').innerHTML=employees.map(x=>`<div class=row><b>${e(x.full_name||'Unnamed')}</b><span class=badge>${e(x.role)}</span><span>${x.active_project_count} projects · ${x.crew_count} crews</span><span class=muted>${e(x.crews||'')}</span></div>`).join('')||'<p>No employees.</p>';$('crews').innerHTML=crews.map(x=>`<div class=row><b>${e(x.crew_name)}</b><span>${e(x.crew_type)}</span><span>${x.active_members} members · ${x.active_assignments} jobs</span><span>${e(x.foreman_name||'No foreman')}</span></div>`).join('')||'<p>No crews.</p>';$('projects').innerHTML=projects.map(x=>`<div class=row><b>${e(x.quote_number||'No #')} — ${e(x.quote_name||x.customer_name)}</b><span class=badge>${e(x.project_stage)}</span><span>${e(x.assigned_staff||'No staff')}</span><span>${e(x.crews||'No crew')}</span></div>`).join('');const po=projects.map(x=>`<option value=${x.canopy_quote_id}>${e(x.quote_number||'No #')} — ${e(x.quote_name||x.customer_name)}</option>`).join(''),pe=employees.filter(x=>x.role!=='customer').map(x=>`<option value=${x.user_id}>${e(x.full_name||'Unnamed')} — ${e(x.role)}</option>`).join(''),co=crews.filter(x=>x.active).map(x=>`<option value=${x.crew_id}>${e(x.crew_name)}</option>`).join('');$('project').innerHTML=po;$('crewProject').innerHTML=po;$('person').innerHTML=pe;$('crew').innerHTML=co}$('createCrew').onclick=async()=>{const r=await sb.from('field_crews').insert({crew_name:$('crewName').value,crew_type:$('crewType').value,crew_size:Number($('crewSize').value)||null});if(r.error)alert(r.error.message);else{ $('crewName').value='';await load()}};$('assignPerson').onclick=async()=>{const r=await sb.from('project_role_assignments').upsert({canopy_quote_id:$('project').value,user_id:$('person').value,assignment_role:$('assignmentRole').value,active:true},{onConflict:'canopy_quote_id,user_id,assignment_role'});if(r.error)alert(r.error.message);else await load()};$('assignCrew').onclick=async()=>{const r=await sb.from('field_assignments').insert({canopy_quote_id:$('crewProject').value,crew_id:$('crew').value,status:$('fieldStatus').value});if(r.error)alert(r.error.message);else await load()};boot();</script></body></html>
