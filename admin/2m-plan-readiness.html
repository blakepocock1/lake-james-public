<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>$2M Plan Readiness | Lake James Canopies</title><link rel="stylesheet" href="/style.css"><style>body{margin:0;background:#f3f3f1}.shell{max-width:1200px;margin:auto;padding:24px}.hidden{display:none!important}.panel,.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin-bottom:14px}.top,.links{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.big{font-size:28px;font-weight:900}.muted{color:#666}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.warn{color:#a45b00;font-weight:900}.good{color:#176f3a;font-weight:900}.login{max-width:420px;margin:70px auto}.login input{width:100%;box-sizing:border-box;margin:5px 0;padding:9px}</style></head><body><div id="login" class="panel login"><h1>Lake James Admin</h1><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin" class="btn">Sign In</button><p id="err"></p></div><main id="app" class="shell hidden"><div class="top"><div><b>LAKE JAMES CANOPIES</b><h1>$2M Plan Readiness</h1><p class="muted">Every management input still required before the $2M model becomes fully numerical.</p></div><div class="links"><a class="btn secondary" href="/admin/revenue-scenarios.html">Revenue Assumptions</a><a class="btn secondary" href="/admin/5m-sales-engine.html">Sales Assumptions</a><a class="btn secondary" href="/admin/5m-cash-plan.html">Cash Assumptions</a><a class="btn secondary" href="/admin/2m-execution-roadmap.html">Roadmap</a><button id="refresh" class="btn secondary">Refresh</button><button id="signout" class="btn secondary">Sign Out</button></div></div><section class="grid" id="cards"></section><section class="panel"><table class="table"><thead><tr><th>Category</th><th>Assumption</th><th>Value</th><th>Where to Configure</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij',{auth:{persistSession:true}}),$=x=>document.getElementById(x);$('signin').onclick=async()=>{let r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)$('err').textContent=r.error.message;else boot()};$('signout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refresh').onclick=load;async function boot(){let u=(await sb.auth.getUser()).data.user;if(!u)return;let p=await sb.from('profiles').select('role').eq('id',u.id).single();if(p.data?.role!=='admin'){await sb.auth.signOut();$('err').textContent='Administrator access required.';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}async function load(){let r=await sb.from('two_million_assumption_readiness').select('*');if(r.error)return alert(r.error.message);let total=r.data.length,ready=r.data.filter(x=>x.status==='CONFIGURED').length,open=total-ready,pct=total?Math.round(ready/total*100):0;$('cards').innerHTML=`<div class="card"><div class="big">${pct}%</div><small>Plan Configured</small></div><div class="card"><div class="big">${ready}</div><small>Assumptions Configured</small></div><div class="card"><div class="big">${open}</div><small>Inputs Still Needed</small></div>`;$('rows').innerHTML=r.data.map(x=>`<tr><td>${x.category}</td><td><b>${x.assumption_name}</b></td><td>${x.value??'—'}</td><td>${x.source_page}</td><td class="${x.status==='CONFIGURED'?'good':'warn'}">${x.status}</td></tr>`).join('')}boot();</script></body></html>
