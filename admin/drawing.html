<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lake James Shop Drawings</title><link rel="stylesheet" href="/style.css"><style>:root{--b:#003b82;--i:#111}body{margin:0;background:#ddd}.toolbar{position:sticky;top:0;z-index:9;background:#111;padding:12px 3%;color:#fff}.toolbar button{margin-right:8px}.sheet{width:11in;height:8.5in;background:#fff;margin:16px auto;position:relative;box-sizing:border-box;padding:.14in;font-family:Arial,sans-serif;color:var(--i);page-break-after:always}.sheet:after{content:'';position:absolute;inset:.08in;border:1px solid #777;pointer-events:none}.head{height:.62in;display:flex;justify-content:space-between;align-items:flex-start;padding:.04in .12in}.logo{font-family:Georgia,serif;font-size:22px;font-weight:700;letter-spacing:1px}.logo small{font:9px Arial;display:block;letter-spacing:5px;text-align:center}.mark{width:125px;height:16px;position:relative}.mark:before{content:'';position:absolute;width:72px;left:0;top:10px;border-top:7px solid #111;transform:skewY(-10deg)}.mark:after{content:'';position:absolute;width:58px;left:67px;top:6px;border-top:7px solid #555;transform:skewY(14deg)}.title{color:var(--b);font-size:14px;font-weight:800;text-decoration:underline;margin-top:18px}.scale{font-size:8px;color:#111;text-decoration:none}.body{padding:0 .12in .7in}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.panel{border:1px solid #aaa;padding:7px}.section{font-size:11px;font-weight:800;color:var(--b);text-decoration:underline}.data{width:100%;border-collapse:collapse;font-size:8px}.data th,.data td{border:1px solid #aaa;padding:4px;text-align:left}.notes{font-size:8px;line-height:1.4}.blue{color:var(--b)}svg{width:100%;height:255px}.steel{fill:#e6eaed;stroke:#111;stroke-width:2}.detail{fill:none;stroke:#111;stroke-width:2}.thin{fill:none;stroke:#666;stroke-width:1}.accent{fill:#003b82;stroke:#003b82}.call{font:9px Arial;fill:#111}.dim{font:bold 10px Arial;fill:#111}.footer{position:absolute;bottom:.08in;left:.08in;right:.08in;height:.58in;border-top:1px solid #777;display:grid;grid-template-columns:1.2fr 1.7fr 1.2fr .7fr}.footer>div{border-right:1px solid #999;padding:4px 7px;font-size:7px}.footer>div:last-child{border:0;background:var(--b);color:#fff;font-size:14px;font-weight:800;text-align:center}.coverTitle{font-size:18px;color:var(--b);font-weight:800}.covergrid{display:grid;grid-template-columns:1fr 1.25fr;gap:10px}.render{height:3in}.warning{font-weight:800}@media print{.toolbar{display:none}body{background:#fff}.sheet{margin:0}@page{size:landscape;margin:0}}</style></head><body><div class="toolbar"><button onclick="print()">Print / Save PDF</button><button onclick="history.back()">Back to Quote</button></div><div id="app"></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij'),id=new URLSearchParams(location.search).get('lead'),fmt=x=>Number(x||0).toFixed(1),esc=x=>String(x||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));let{data:{user}}=await sb.auth.getUser();if(!user)location.href='/admin/leads.html';let{data:lead}=await sb.from('canopy_assessment_leads').select('*').eq('id',id).single(),{data:q}=await sb.from('lead_quotes').select('*').eq('lead_id',id).order('created_at',{ascending:false}).limit(1).single();if(!q)throw Error('No saved quote');let L=+q.canopy_length_ft||0,W=+q.canopy_width_ft||0,H=+q.canopy_height_ft||0,F=+q.fascia_height_in||12,C=+q.column_count||0,S=+q.roof_slope_in_per_ft||.25,D=+q.downspout_count||0,customer=lead.company_name||lead.station_name||lead.contact_name||'',loc=lead.site_address||lead.address||[lead.city,lead.state].filter(Boolean).join(', '),project=q.title||'Gas Station Canopy',job=q.id.slice(0,8).toUpperCase(),date=new Date().toLocal ="120" y="55" width="260" height="190" class="steel"/><rect x="205" y="105" width="90" height="90" class="detail"/>${[[160,90],[340,90],[160,210],[340,210]].map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="9" class="detail"/>`).join('')}<text x="250" y="275" text-anchor="middle" class="call">PLATE SIZE / HOLE PATTERN — ${eng}</text></svg></div></div>`;let base=`<div class="grid2"><div><div class="section">BASE PLATE ELEVATION</div><svg viewBox="0 0 500 300"><rect x="210" y="30" width="80" height="125" class="steel"/><rect x="145" y="150" width="210" height="18" class="steel"/><rect x="110" y="168" width="280" height="100" fill="#eee" stroke="#555"/><path d="M175 155v90 M325 155v90" class="detail"/><text x="345" y="150" class="call">BASE PLATE</text><text x="330" y="225" class="call">ANCHOR BOLTS</text></svg></div><div><div class="section">BASE PLATE PLAN</div><svg viewBox="0 0 500 300"><rect x="115" y="35" width="270" height="215" class="steel"/><rect x="205" y="95" width="90" height="100" class="detail"/>${[[155,75],[345,75],[155,210],[345,210]].map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="9" class="detail"/>`).join('')}<circle cx="250" cy="145" r="25" class="detail"/><text x="250" y="278" text-anchor="middle" class="call">ANCHOR PATTERN / CONDUIT OPENING — ${eng}</text></svg></div></div>`;let purlin=`<div class="grid2"><div><div class="section">PURLIN TO CARRIER CONNECTION</div><svg viewBox="0 0 500 300"><rect x="70" y="160" width="360" height="55" class="steel"/><rect x="220" y="55" width="60" height="105" class="steel"/><circle cx="235" cy="150" r="6" class="accent"/><circle cx="265" cy="150" r="6" class="accent"/><text x="295" y="95" class="call">PURLIN</text><text x="310" y="195" class="call">CARRIER</text><text x="250" y="270" text-anchor="middle" class="call">CONNECTION — ${eng}</text></svg></div><div><div class="section">DECK PAN DETAIL</div><svg viewBox="0 0 500 300"><path d="M45 165h55l20-35 20 35h55l20-35 20 35h55l20-35 20 35h55l20-35 20 35h55" class="detail"/><text x="250" y="105" text-anchor="middle" class="call">DECK PROFILE / GAUGE — PROJECT SPECIFICATION</text><text x="250" y="220" text-anchor="middle" class="call">BEARING / SIDE LAP — MANUFACTURER REQUIREMENTS</text></svg></div></div>`;let fascia=`<div class="grid2"><div><div class="section">FASCIA DETAILS</div><svg viewBox="0 0 500 300"><rect x="95" y="55" width="90" height="190" class="accent"/><rect x="185" y="90" width="240" height="95" class="steel"/><path d="M190 180L390 90" class="detail"/><path d="M190 185Q210 235 255 245" class="detail"/><text x="270" y="65" class="call">FASCIA BRACE</text><text x="270" y="120" class="call">C-CHANNEL</text><text x="270" y="205" class="call">GUTTER — SEE SHEET 9</text></svg></div><div class="panel notes"><b class="blue">FASCIA SCHEDULE</b><br><br>FASCIA HEIGHT: ${fmt(F)}&quot;<br>FASCIA PANEL: PROJECT SPECIFICATION<br>CONTINUOUS CLEAT: PROJECT SPECIFICATION<br>TOP/BOTTOM TRIM: PROJECT SPECIFICATION<br>BRACE SPACING: ${eng}</div></div>`;let splice=`<div class="grid2"><div><div class="section">PURLIN SPLICE DETAILS</div><svg viewBox="0 0 500 300"><rect x="45" y="105" width="410" height="55" class="steel"/><rect x="190" y="92" width="120" height="80" class="thin"/>${[215,245,275].map(x=>`<circle cx="${x}" cy="125" r="5" class="accent"/>`).join('')}<text x="250" y="70" text-anchor="middle" class="call">SPLICE / OVERLAP / BOLT PATTERN — ${eng}</text></svg></div><div><div class="section">BEAM REINFORCEMENT AT SUPPORT</div><svg viewBox="0 0 500 300"><path d="M55 85h390v25H270v115h175v25H55v-25h175V110H55z" class="steel"/><rect x="235" y="105" width="30" height="125" class="accent"/><text x="250" y="275" text-anchor="middle" class="call">STIFFENER / REINFORCEMENT — ${eng}</text></svg></div></div>`;let drain=`<div class="grid3"><div><div class="section">TYPICAL PERIMETER GUTTER</div><svg viewBox="0 0 320 300"><path d="M55 75h130v30h-75v55q0 45 45 65v45" class="detail"/><text x="35" y="55" class="call">CONTINUOUS GUTTER</text><text x="145" y="250" class="call">DOWNSPOUT</text></svg></div><div><div class="section">DOWNSPOUT DETAIL</div><svg viewBox="0 0 320 300"><rect x="140" y="45" width="35" height="210" class="steel"/><path d="M120 65h75M120 235h75" class="thin"/><text x="35" y="150" class="call">DOWNSPOUT STRAPS</text></svg></div><div><div class="section">INTERNAL DRAIN OPTION</div><svg viewBox="0 0 320 300"><rect x="35" y="65" width="220" height="40" class="steel"/><path d="M150 65v165q0 30 35 40" class="detail"/><text x="155" y="145" class="call">PVC DRAIN PIPE</text><text x="155" y="265" class="call">EMERGENCY OVERFLOW</text></svg></div></div><div class="notes">QUOTE CALCULATION: ${D} DOWNSPOUT(S). FINAL GUTTER/DOWNSPOUT SIZING, INTERNAL DRAIN ROUTING, OVERFLOW AND DISCHARGE REQUIRE PROJECT DESIGN.</div>`;document.getElementById('app').innerHTML=sheet(1,'',cover)+sheet(2,'ROOF FRAMING PLAN',`<div class="panel">${plan()}</div><div class="notes">PLAN DATA: ${fmt(L)}' × ${fmt(W)}' · ${C} COLUMNS · ROOF SLOPE ${fmt(S)}&quot;:12&quot;. STRUCTURAL SIZES/SPACING: ${eng}.</div>`)+sheet(3,'STRUCTURAL CONNECTION DETAILS',connection)+sheet(4,'BASE PLATE DETAILS',base)+sheet(5,'PURLIN TO CARRIER CONNECTION & DECK PAN DETAIL',purlin)+sheet(6,'FASCIA DETAILS',fascia)+sheet(7,'COLUMN & FOOTING ELEVATION',`<div class="panel">${elev()}</div><div class="notes">FOOTING DIMENSIONS, REINFORCEMENT, ANCHOR EMBEDMENT, CONCRETE STRENGTH AND SOIL BEARING: ${eng}.</div>`)+sheet(8,'PURLIN SPLICE DETAILS',splice)+sheet(9,'ROOF DRAINAGE DETAILS',drain);</script></body></html>
