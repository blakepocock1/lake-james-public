xed(0)} SF</td><td>L × W</td></tr><tr><td>Deck allowance</td><td>${deck.toFixed(0)} SF</td><td>5% waste</td></tr><tr><td>Fascia face allowance</td><td>${fascia.toFixed(0)} SF</td><td>Perimeter × height + 8%</td></tr><tr><td>Gutter allowance</td><td>${gutter.toFixed(1)} LF</td><td>Perimeter + 5%</td></tr><tr><td>Downspouts</td><td>${D}</td><td>Quote</td></tr><tr><td>Columns</td><td>${C}</td><td>Quote</td></tr><tr><td>Column clear length</td><td>${(C*H).toFixed(1)} LF</td><td>Qty × clear height</td></tr><tr><td>Typical bay</td><td>${bay.toFixed(2)} FT</td><td>L / (columns-1)</td></tr></table></div><div class="box"><h3>ENGINEER / FABRICATOR TO COMPLETE</h3><table class="tbl"><tr><td>Column section / wall</td><td>ENGINEER INPUT</td></tr><tr><td>Carrier section</td><td>ENGINEER INPUT</td></tr><tr><td>Purlin section / spacing</td><td>ENGINEER INPUT</td></tr><tr><td>Base / top plates</td><td>ENGINEER INPUT</td></tr><tr><td>Anchor rods</td><td>ENGINEER INPUT</td></tr><tr><td>Connection bolts / welds</td><td>ENGINEER INPUT</td></tr><tr><td>Footings / reinforcing</td><td>ENGINEER INPUT</td></tr></table><div class="warn">This takeoff is geometry-based and is not a structural material certification or fabrication release.</div></div></div>`;let calc=`<div class="grid2"><div class="box"><h3>STRUCTURAL DESIGN INPUTS</h3><table class="tbl"><tr><td>Dead load</td><td>ENGINEER INPUT psf</td></tr><tr><td>Roof snow load</td><td>ENGINEER INPUT psf</td></tr><tr><td>Wind speed / exposure</td><td>ENGINEER INPUT</td></tr><tr><td>Rain / ponding</td><td>ENGINEER INPUT</td></tr><tr><td>Seismic criteria</td><td>ENGINEER INPUT</td></tr><tr><td>Allowable soil bearing</td><td>ENGINEER INPUT psf</td></tr><tr><td>Steel grade</td><td>ENGINEER INPUT</td></tr></table></div><div class="box"><h3>GEOMETRY AVAILABLE TO DESIGN</h3><div class="calc">CANOPY AREA       = ${A.toFixed(2)} sf\nLENGTH             = ${L.toFixed(2)} ft\nWIDTH              = ${W.toFixed(2)} ft\nCLEAR HEIGHT       = ${H.toFixed(2)} ft\nCOLUMN COUNT       = ${C}\nTYPICAL BAY        = ${bay.toFixed(2)} ft\nROOF SLOPE         = ${RS.toFixed(3)} in/ft\nFASCIA HEIGHT      = ${FH.toFixed(1)} in\n\nPURLIN DESIGN      = ENGINEER INPUT\nCARRIER DESIGN     = ENGINEER INPUT\nCOLUMN DESIGN      = ENGINEER INPUT\nFOUNDATION DESIGN  = ENGINEER INPUT</div></div></div>`;let approval=`<div class="grid2"><div class="box"><h3>ENGINEERING DESIGN SUMMARY</h3><table class="tbl"><tr><td>Governing code / edition</td><td>________________</td></tr><tr><td>Design loads approved</td><td>________________</td></tr><tr><td>Purlin selection</td><td>________________</td></tr><tr><td>Carrier selection</td><td>________________</td></tr><tr><td>Column selection</td><td>________________</td></tr><tr><td>Connections</td><td>________________</td></tr><tr><td>Foundation design</td><td>________________</td></tr></table></div><div class="box"><h3>REVIEW / RELEASE</h3><p class="sm">Engineer of Record: ______________________________</p><p class="sm">License / State: _________________________________</p><p class="sm">Signature: _______________________________________</p><p class="sm">Date: ____________________________________________</p><p class="sm">Revision: ________________________________________</p><div class="warn">DRAWINGS REMAIN PRELIMINARY UNTIL STRUCTURAL DESIGN IS COMPLETED AND THE PACKAGE IS REVIEWED/APPROVED FOR THE PROJECT.</div></div></div>`;document.getElementById('app').innerHTML=sheet(1,'COVER / GENERAL NOTES',cover)+sheet(2,'ROOF FRAMING PLAN',plan())+sheet(3,'STRUCTURAL CONNECTION DETAILS',conn)+sheet(4,'BASE PLATE / ANCHOR DETAILS',base)+sheet(5,'PURLIN / CARRIER / DECK DETAILS',pd)+sheet(6,'FASCIA DETAILS',fascia)+sheet(7,'COLUMN / FOOTING ELEVATION',elev())+sheet(8,'PURLIN SPLICE / REINFORCEMENT',splice)+sheet(9,'ROOF DRAINAGE DETAILS',drain)+sheet(10,'MATERIAL / BOM SCHEDULE',bom)+sheet(11,'STRUCTURAL DESIGN WORKSHEET',calc)+sheet(12,'ENGINEERING SUMMARY / APPROVAL',approval);</script></body></html>
