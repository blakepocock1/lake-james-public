<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page Editor | Lake James Admin</title><link rel="stylesheet" href="/style.css"><style>.admin{max-width:1300px;margin:auto;padding:32px 4%}.hidden{display:none!important}.login{max-width:430px;margin:80px auto}.layout{display:grid;grid-template-columns:340px 1fr;gap:20px}.panel{background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px}.pages{max-height:70vh;overflow:auto}.group{font-size:11px;font-weight:900;text-transform:uppercase;color:#777;margin:18px 0 6px}.page{display:block;width:100%;text-align:left;padding:10px;border:0;border-bottom:1px solid #eee;background:#fff;cursor:pointer}.page.active{background:#171718;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{display:none;padding:10px;background:#e8f7ef;border-radius:8px;margin:10px 0}.error{background:#fdebea}.adminnav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 25px}.muted{color:#666}@media(max-width:800px){.layout{grid-template-columns:1fr}.pages{max-height:300px}.row{grid-template-columns:1fr}}</style></head><body><div id="login" class="login formbox"><h1>Page Editor</h1><p>Sign in with your Lake James admin account.</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="signin" class="btn">Sign In</button><div id="loginerr" class="notice error"></div></div><main id="app" class="admin hidden"><h1>Every Page</h1><p class="muted">Select any public page and change its hero content and image without touching GitHub.</p><nav class="adminnav"><a class="btn secondary" href="/admin/website.html">Website Manager</a><a class="btn" href="/admin/pages.html">Every Page</a><a class="btn secondary" href="/admin/leads.html">Lead Pipeline</a><a class="btn secondary" href="/" target="_blank">Open Website ↗</a><button id="signout" class="btn secondary">Sign Out</button></nav><div id="ok" class="notice"></div><div id="err" class="notice error"></div><div class="layout"><aside class="panel pages" id="pages"></aside><section class="panel"><h2 id="label">Choose a page</h2><p id="path" class="muted"></p><div id="form" class="hidden"><label>Eyebrow</label><input id="eyebrow"><label>Headline</label><textarea id="headline"></textarea><label>Subheadline</label><textarea id="subheadline"></textarea><label>Hero Image</label><input id="heroFile" type="file" accept="image/*"><button id="upload" class="btn secondary" type="button">Upload Hero Image</button><input id="heroUrl" placeholder="Hero image URL"><div class="row"><div><label>CTA Button Text</label><input id="ctaText"></div><div><label>CTA Link</label><input id="ctaHref"></div></div><label><input id="enabled" type="checkbox" style="width:auto"> Enable page overrides</label><br><br><button id="save" class="btn">Publish This Page</button><a id="open" class="btn secondary" target="_blank">Preview Page ↗</a></div></section></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij',{auth:{persistSession:true}}),$=x=>document.getElementById(x);let rows=[],current=null;function msg(id,t){$(id).textContent=t;$(id).style.display='block';setTimeout(()=>$(id).style.display='none',4000)}async function boot(){let u=await sb.auth.getUser();if(!u.data.user)return;let p=await sb.from('profiles').select('role').eq('id',u.data.user.id).single();if(p.error||p.data?.role!=='admin'){await sb.auth.signOut();return msg('loginerr','Internal admin access required.')} $('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}$('signin').onclick=async()=>{let r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return msg('loginerr',r.error.message);boot()};$('signout').onclick=async()=>{await sb.auth.signOut();location.reload()};async function load(){let r=await sb.from('website_pages').select('*').order('page_group').order('label');if(r.error)return msg('err',r.error.message);rows=r.data||[];let last='';$('pages').innerHTML=rows.map(x=>{let h=x.page_group!==last?`<div class="group">${x.page_group}</div>`:'';last=x.page_group;return h+`<button class="page" data-path="${x.path}">${x.label}</button>`}).join('');document.querySelectorAll('.page').forEach(b=>b.onclick=()=>select(b.dataset.path,b))}function select(path,b){current=rows.find(x=>x.path===path);document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('label').textContent=current.label;$('path').textContent=current.path;$('eyebrow').value=current.hero_eyebrow||'';$('headline').value=current.hero_headline||'';$('subheadline').value=current.hero_subheadline||'';$('heroUrl').value=current.hero_image_url||'';$('ctaText').value=current.cta_text||'';$('ctaHref').value=current.cta_href||'';$('enabled').checked=current.is_enabled;$('open').href=current.path;$('form').classList.remove('hidden')}async function uploadFile(file){if(!file)return msg('err','Choose an image first.');let safe=Date.now()+'-'+file.name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-'),r=await sb.storage.from('website-media').upload(safe,file);if(r.error)return msg('err',r.error.message);$('heroUrl').value=sb.storage.from('website-media').getPublicUrl(safe).data.publicUrl;msg('ok','Image uploaded. Publish the page when ready.')}$('upload').onclick=()=>uploadFile($('heroFile').files[0]);$('save').onclick=async()=>{if(!current)return;let payload={hero_eyebrow:$('eyebrow').value.trim()||null,hero_headline:$('headline').value.trim()||null,hero_subheadline:$('subheadline').value.trim()||null,hero_image_url:$('heroUrl').value.trim()||null,cta_text:$('ctaText').value.trim()||null,cta_href:$('ctaHref').value.trim()||null,is_enabled:$('enabled').checked,updated_at:new Date().toISOString()},r=await sb.from('website_pages').update(payload).eq('path',current.path);if(r.error)return msg('err',r.error.message);Object.assign(current,payload);msg('ok',current.label+' published.')} ;boot();</script></body></html>
