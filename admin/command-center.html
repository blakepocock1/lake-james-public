<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operations Command Center | Lake James Canopies</title><link rel="stylesheet" href="/style.css"><style>body{margin:0;background:#f3f3f1}.shell{max-width:1400px;margin:auto;padding:24px}.hidden{display:none!important}.panel,.kpi{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.big{font-size:30px;font-weight:900}.muted{color:#666}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.filter{border:1px solid #ccc;border-radius:20px;background:#fff;padding:8px 12px}.filter.active{background:#171718;color:#fff}.task{display:grid;grid-template-columns:120px 1fr 180px 150px;gap:12px;align-items:center;border-top:1px solid #eee;padding:13px 0}.badge{display:inline-block;border-radius:15px;padding:5px 8px;font-size:10px;font-weight:900;text-transform:uppercase;background:#e8e8e8}.badge.critical{background:#f7dada}.badge.attention{background:#fff0bd}.badge.info{background:#dfeaf7}.login{max-width:420px;margin:70px auto}.login input{width:100%;box-sizing:border-box;padding:12px;margin:5px 0}.alerts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.alert{border:1px solid #ddd;border-radius:9px;padding:12px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.task{grid-template-columns:1fr}.alerts{grid-template-columns:1fr}}</style></head><body><div id="login" class="panel login"><h1>Lake James Admin</h1><p>Operations Command Center</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin" class="btn">Sign In</button><p id="loginerr"></p></div><main id="app" class="shell hidden"><div class="top"><div><b>LAKE JAMES CANOPIES</b><h1>Operations Command Center</h1><p class="muted">What needs attention today.</p></div><div><button id="refresh" class="btn secondary">Refresh</button> <button id="signout" class="btn secondary">Sign Out</button></div></div><section class="grid"><div class="kpi"><div id="criticalK" class="big">0</div><small>Critical</small></div><div class="kpi"><div id="inspectionK" class="big">0</div><small>Inspections Due</small></div><div class="kpi"><div id="quotesK" class="big">0</div><small>Quotes Waiting</small></div><div class="kpi"><div id="scheduleK" class="big">0</div><small>Work to Schedule</small></div><div class="kpi"><div id="renewalK" class="big">0</div><small>Renewals ≤90 Days</small></div></section><section class="panel"><div class="top"><h2>Action Queue</h2><select id="customer"><option value="">All customers</option></select></div><div class="filters"><button class="filter active" data-type="">All</button><button class="filter" data-type="inspection_due">Inspections</button><button class="filter" data-type="critical_deficiency">Critical</button><button class="filter" data-type="quote_waiting">Quotes</button><button class="filter" data-type="approved_unscheduled">Scheduling</button><button class="filter" data-type="work_overdue">Overdue Work</button><button class="filter" data-type="contract_renewal">Renewals</button><button class="filter" data-type="quarterly_review">Reviews</button></div><div id="tasks"></div></section><section class="panel"><div class="top"><h2>Recent System Alerts</h2><button id="clearAlerts" class="btn secondary">Acknowledge All</button></div><div id="alerts" class="alerts"></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij',{auth:{persistSession:true}}),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])),fmt=v=>v?new Date(v).toLocaleDateString():'—';let tasks=[],alerts=[],type='';async function boot(){const u=(await sb.auth.getUser()).data.user;if(!u)return;const p=await sb.from('profiles').select('role').eq('id',u.id).single();if(p.data?.role!=='admin'){await sb.auth.signOut();$('loginerr').textContent='Administrator access required.';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}$('signin').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)$('loginerr').textContent=r.error.message;else boot()};$('signout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refresh').onclick=()=>load();async function load(){const [t,a]=await Promise.all([sb.from('operations_command_center').select('*').order('due_at',{ascending:true,nullsFirst:true}),sb.from('operations_notifications').select('*').eq('status','open').order('created_at',{ascending:false}).limit(20)]);tasks=t.data||[];alerts=a.data||[];const orgs=[...new Map(tasks.map(x=>[x.organization_id,x.customer_name])).entries()];$('customer').innerHTML='<option value="">All customers</option>'+orgs.map(([id,n])=>`<option value="${id}">${esc(n)}</option>`).join('');$('criticalK').textContent=tasks.filter(x=>x.severity==='critical').length;$('inspectionK').textContent=tasks.filter(x=>x.task_type==='inspection_due').length;$('quotesK').textContent=tasks.filter(x=>x.task_type==='quote_waiting').length;$('scheduleK').textContent=tasks.filter(x=>x.task_type==='approved_unscheduled').length;$('renewalK').textContent=tasks.filter(x=>x.task_type==='contract_renewal').length;render();renderAlerts()}function render(){const customer=$('customer').value,rows=tasks.filter(x=>(!type||x.task_type===type)&&(!customer||x.organization_id===customer));$('tasks').innerHTML=rows.length?rows.map(x=>`<div class="task"><div><span class="badge ${x.severity}">${esc(x.severity)}</span></div><div><b>${esc(x.title)}</b><div class="muted">${esc(x.customer_name)} · ${esc(x.detail)}</div></div><div><small>Due / target</small><br><b>${fmt(x.due_at)}</b></div><div><a class="btn secondary" href="${esc(x.action_path)}">Open</a></div></div>`).join(''):'<p class="muted">Nothing currently needs attention in this category.</p>'}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});$('customer').onchange=render;function renderAlerts(){$('alerts').innerHTML=alerts.length?alerts.map(x=>`<div class="alert"><span class="badge ${x.severity}">${esc(x.severity)}</span><h3>${esc(x.title)}</h3><p>${esc(x.message||'')}</p><small>${new Date(x.created_at).toLocaleString()}</small><br><button class="btn secondary ack" data-id="${x.id}">Acknowledge</button></div>`).join(''):'<p class="muted">No open system alerts.</p>';document.querySelectorAll('.ack').forEach(b=>b.onclick=async()=>{await sb.from('operations_notifications').update({status:'acknowledged',acknowledged_at:new Date().toISOString()}).eq('id',b.dataset.id);load()})}$('clearAlerts').onclick=async()=>{const ids=alerts.map(x=>x.id);if(ids.length)await sb.from('operations_notifications').update({status:'acknowledged',acknowledged_at:new Date().toISOString()}).in('id',ids);load()};boot();</script></body></html>
