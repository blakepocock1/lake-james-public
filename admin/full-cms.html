meta" style="min-height:65px"></textarea></div><h3>Editable Content & Images</h3><div id="items"></div><h3>Revision History</h3><div id="revisions"></div></aside><section class="framewrap"><iframe id="preview"></iframe></section></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij',{auth:{persistSession:true}}),$=id=>document.getElementById(id);let pages=[],current=null,nodes=[],selected=-1,overrides=[],mediaUrls=[];const selector='main h1,main h2,main h3,main h4,main p,main li,main a,main img,footer p,footer span,footer strong,footer img',heroSelector='.hero,.pagehero,.pageHero,.projectHero,.serviceHero,.locationHero,[data-site-hero]';const esc=s=>String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function keyOf(el){if(el.dataset.cmsKey)return el.dataset.cmsKey;const parts=[];let n=el;while(n&&n.nodeType===1){if(n.id){parts.unshift('#'+CSS.escape(n.id));break}let seg=n.tagName.toLowerCase(),p=n.parentElement;if(p){const same=[...p.children].filter(x=>x.tagName===n.tagName);if(same.length>1)seg+=`:nth-of-type(${same.indexOf(n)+1})`}parts.unshift(seg);if(n.matches('main,footer'))break;n=p}return parts.join('>')}function show(id,t){$(id).textContent=t;$(id).style.display='block';setTimeout(()=>$(id).style.display='none',4000)}async function boot(){const u=await sb.auth.getUser();if(!u.data.user)return;const p=await sb.from('profiles').select('role').eq('id',u.data.user.id).single();if(p.error||p.data?.role!=='admin'){await sb.auth.signOut();return show('loginerr','Internal admin access required.')}$('login').classList.add('hidden');$('app').classList.remove('hidden');const r=await sb.from('website_pages').select('*').order('page_group').order('label');if(r.error)return show('err',r.error.message);pages=r.data||[];$('page').innerHTML=pages.map((x,i)=>`<option value="${i}">${esc(x.page_group)} — ${esc(x.label)}</option>`).join('');await loadMedia();choose(0)}$('signin').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return show('loginerr',r.error.message);boot()};$('signout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('page').onchange=()=>choose(+$('page').value);$('reload').onclick=()=>loadFrame();async function choose(i){current=pages[i];const hasDraft=(Array.isArray(current.draft_content_overrides)&&current.draft_content_overrides.length>0)||current.draft_page_title!==null||current.draft_meta_description!==null;overrides=structuredClone(hasDraft?current.draft_content_overrides:(current.content_overrides||[]));$('pageTitle').value=(hasDraft?current.draft_page_title:current.page_title)||'';$('meta').value=(hasDraft?current.draft_meta_description:current.meta_description)||'';$('status').textContent=hasDraft?'DRAFT':'LIVE';$('open').href=current.path;selected=-1;$('editForm').classList.add('hidden');loadFrame();loadRevisions()}function loadFrame(){$('preview').src=current.path+'?cms_preview='+Date.now()}$('preview').onload=()=>{try{const d=$('preview').contentDocument;nodes=[...d.querySelectorAll(selector)].filter(el=>!el.closest('script,style,form')&&!el.closest(heroSelector)&&!el.matches('[data-cms-ignore]'));const byKey=new Map(nodes.map((el,i)=>[keyOf(el),i]));nodes.forEach((el,i)=>{el.style.cursor='pointer';el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();select(i)})});for(const o of overrides){let i=o.key?byKey.get(o.key):undefined;if(i===undefined&&Number.isInteger(o.i))i=o.i;const el=nodes[i];if(!el)continue;if(typeof o.text==='string'&&el.tagName!=='IMG')el.textContent=o.text;if(o.href&&el.tagName==='A')el.href=o.href;if(o.src&&el.tagName==='IMG')el.src=o.src}renderItems()}catch(e){show('err','Preview could not be made editable.')}}function renderItems(){$('items').innerHTML=nodes.map((el,i)=>`<div class="item ${i===selected?'active':''}" data-i="${i}"><div class="tag">${el.tagName.toLowerCase()} #${i+1}</div><p>${el.tagName==='IMG'?'Image: '+esc(el.getAttribute('alt')||el.src):esc(el.textContent.trim())||'(empty)'}</p></div>`).join('');$('items').querySelectorAll('.item').forEach(x=>x.onclick=()=>select(+x.dataset.i))}function select(i){nodes.forEach(n=>n.classList.remove('selected-outline'));selected=i;const el=nodes[i];el.classList.add('selected-outline');el.scrollIntoView({behavior:'smooth',block:'center'});$('editTitle').textContent='Editing item '+(i+1);$('editTag').textContent=el.tagName.toLowerCase();const img=el.tagName==='IMG',link=el.tagName==='A';$('editText').parentElement.classList.toggle('hidden',img);$('editText').value=img?'':el.textContent.trim();$('linkFields').classList.toggle('hidden',!link);$('editHref').value=link?el.getAttribute('href')||'':'';$('imageFields').classList.toggle('hidden',!img);$('editSrc').value=img?el.getAttribute('src')||'':'';$('editForm').classList.remove('hidden');renderItems()}$('apply').onclick=()=>{if(selected<0)return;const el=nodes[selected],key=keyOf(el),o={key,i:selected};if(el.tagName==='IMG'){o.src=$('editSrc').value.trim();if(o.src)el.src=o.src}else{o.text=$('editText').value;el.textContent=o.text;if(el.tagName==='A'){o.href=$('editHref').value.trim();if(o.href)el.href=o.href}}const at=overrides.findIndex(x=>x.key===key||(!x.key&&x.i===selected));at>=0?overrides[at]=o:overrides.push(o);$('status').textContent='UNSAVED';renderItems();show('ok','Applied to draft preview.')} ;$('revert').onclick=()=>{const key=selected>=0?keyOf(nodes[selected]):'';overrides=overrides.filter(x=>x.key?x.key!==key:x.i!==selected);$('status').textContent='UNSAVED';loadFrame()};async function saveDraft(){const payload={draft_content_overrides:overrides,draft_page_title:$('pageTitle').value.trim()||'',draft_meta_description:$('meta').value.trim()||'',updated_at:new Date().toISOString()},r=await sb.from('website_pages').update(payload).eq('path',current.path);if(r.error)return show('err',r.error.message);Object.assign(current,payload);$('status').textContent='DRAFT';show('ok','Draft saved. The live website was not changed.')}$('saveDraft').onclick=saveDraft;$('publish').onclick=async()=>{if(!confirm('Publish these changes to the live website?'))return;const old={page_path:current.path,content_overrides:current.content_overrides||[],page_title:current.page_title||null,meta_description:current.meta_description||null};let rr=await sb.from('website_page_revisions').insert(old);if(rr.error)return show('err',rr.error.message);const payload={content_overrides:overrides,page_title:$('pageTitle').value.trim()||null,meta_description:$('meta').value.trim()||null,draft_content_overrides:[],draft_page_title:null,draft_meta_description:null,updated_at:new Date().toISOString()},r=await sb.from('website_pages').update(payload).eq('path',current.path);if(r.error)return show('err',r.error.message);Object.assign(current,payload);$('status').textContent='LIVE';show('ok','Published live. Previous version saved to history.');loadFrame();loadRevisions()};async function loadRevisions(){const r=await sb.from('website_page_revisions').select('*').eq('page_path',current.path).order('created_at',{ascending:false}).limit(10);$('revisions').innerHTML=(r.data||[]).map(x=>`<div class="revision"><b>${new Date(x.created_at).toLocaleString()}</b><br><button class="smallbtn restore" data-id="${x.id}">Restore this version</button></div>`).join('')||'<p class="muted">No previous publishes yet.</p>';$('revisions').querySelectorAll('.restore').forEach(b=>b.onclick=()=>restore(+b.dataset.id,r.data))}async function restore(id,list){const x=list.find(v=>v.id===id);if(!x||!confirm('Restore this version as a draft?'))return;overrides=structuredClone(x.content_overrides||[]);$('pageTitle').value=x.page_title||'';$('meta').value=x.meta_description||'';$('status').textContent='UNSAVED';loadFrame();show('ok','Revision loaded as a draft. Review it, then Save Draft or Publish Live.')}async function loadMedia(){const r=await sb.storage.from('website-media').list('',{limit:100,sortBy:{column:'created_at',order:'desc'}});mediaUrls=(r.data||[]).filter(x=>!x.name.startsWith('.')).map(x=>sb.storage.from('website-media').getPublicUrl(x.name).data.publicUrl);$('media').innerHTML=mediaUrls.map(u=>`<button type="button" data-url="${esc(u)}"><img src="${esc(u)}"></button>`).join('');$('media').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('editSrc').value=b.dataset.url})}async function uploadFile(file){if(!file)throw Error('Choose an image first.');if(file.size>10485760)throw Error('Image must be under 10 MB.');const name=Date.now()+'-'+file.name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-'),r=await sb.storage.from('website-media').upload(name,file);if(r.error)throw r.error;return sb.storage.from('website-media').getPublicUrl(name).data.publicUrl}$('uploadImage').onclick=async()=>{try{$('editSrc').value=await uploadFile($('imageFile').files[0]);await loadMedia();show('ok','Image uploaded. Click Apply to Draft.')}catch(e){show('err',e.message)}};window.addEventListener('beforeunload',e=>{if($('status').textContent==='UNSAVED'){e.preventDefault();e.returnValue=''}});boot();</script></body></html>
