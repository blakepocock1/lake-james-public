<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual Page Editor | Lake James Admin</title><link rel="stylesheet" href="/style.css"><style>body{margin:0;background:#f4f4f2}.shell{max-width:1600px;margin:auto;padding:24px 3%}.hidden{display:none!important}.login{max-width:430px;margin:80px auto;background:#fff;padding:28px;border-radius:12px}.top,.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.toolbar{background:#fff;padding:14px;border:1px solid #ddd;border-radius:10px;margin:14px 0}.toolbar select{min-width:280px}.grid{display:grid;grid-template-columns:340px 1fr;gap:16px}.panel{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;max-height:calc(100vh - 180px);overflow:auto}.framewrap{background:#222;border-radius:12px;padding:10px;min-height:760px}.framewrap iframe{width:100%;height:calc(100vh - 205px);min-height:740px;border:0;background:#fff;border-radius:7px}.item{border:1px solid #ddd;border-radius:8px;padding:10px;margin:8px 0;cursor:pointer}.item:hover,.item.active{border-color:#111;background:#f6f6f4}.tag{font-size:10px;font-weight:900;text-transform:uppercase;color:#777}.item p{font-size:12px;margin:5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.notice{display:none;padding:10px;border-radius:7px;background:#e8f7ef;margin:8px 0}.error{background:#fdebea}.editbox{position:sticky;top:0;background:#fff;padding-bottom:12px;border-bottom:1px solid #ddd;z-index:2}.editbox textarea{min-height:120px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.muted{color:#666;font-size:13px}.selected-outline{outline:3px solid #e0a800!important;outline-offset:3px!important}@media(max-width:900px){.grid{grid-template-columns:1fr}.panel{max-height:none}.framewrap iframe{height:700px}}</style></head><body><div id="login" class="login"><h1>Visual Page Editor</h1><p>Sign in with your Lake James admin account.</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="signin" class="btn">Sign In</button><div id="loginerr" class="notice error"></div></div><main id="app" class="shell hidden"><div class="top"><div><h1>Visual Page Editor</h1><p class="muted">Choose a page, click text in the live website, edit it, then publish.</p></div><div><a class="btn secondary" href="/admin/website.html">Website Manager</a> <button id="signout" class="btn secondary">Sign Out</button></div></div><div id="ok" class="notice"></div><div id="err" class="notice error"></div><div class="toolbar"><label>Page</label><select id="page"></select><button id="reload" class="btn secondary">Reload Preview</button><button id="publish" class="btn">Publish Page Changes</button><button id="reset" class="btn secondary">Reset Body Edits</button><a id="open" class="btn secondary" target="_blank">Open Live Page ↗</a></div><div class="grid"><aside class="panel"><div class="editbox"><h3 id="editTitle">Click content to edit</h3><div id="editForm" class="hidden"><div class="tag" id="editTag"></div><label>Text</label><textarea id="editText"></textarea><div id="linkFields" class="hidden"><label>Link</label><input id="editHref"></div><button id="apply" class="btn">Apply to Preview</button><button id="revert" class="btn secondary">Revert Item</button></div><hr><label>Browser/Page Title</label><input id="pageTitle"><label>Meta Description</label><textarea id="meta" style="min-height:70px"></textarea></div><h3>Editable Content</h3><p class="muted">You can click an item here or directly in the preview.</p><div id="items"></div></aside><section class="framewrap"><iframe id="preview"></iframe></section></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij',{auth:{persistSession:true}}),$=id=>document.getElementById(id);let pages=[],current=null,nodes=[],selected=-1,overrides=[];const selector='main h1,main h2,main h3,main h4,main p,main li,main a,footer p,footer span,footer strong';function show(id,t){$(id).textContent=t;$(id).style.display='block';setTimeout(()=>$(id).style.display='none',4000)}async function boot(){const u=await sb.auth.getUser();if(!u.data.user)return;const p=await sb.from('profiles').select('role').eq('id',u.data.user.id).single();if(p.error||p.data?.role!=='admin'){await sb.auth.signOut();return show('loginerr','Internal admin access required.')}$('login').classList.add('hidden');$('app').classList.remove('hidden');const r=await sb.from('website_pages').select('*').order('page_group').order('label');if(r.error)return show('err',r.error.message);pages=r.data||[];$('page').innerHTML=pages.map((x,i)=>`<option value="${i}">${x.page_group} — ${x.label}</option>`).join('');choose(0)}$('signin').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return show('loginerr',r.error.message);boot()};$('signout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('page').onchange=()=>choose(+$('page').value);$('reload').onclick=()=>loadFrame();function choose(i){current=pages[i];overrides=Array.isArray(current.content_overrides)?structuredClone(current.content_overrides):[];$('pageTitle').value=current.page_title||'';$('meta').value=current.meta_description||'';$('open').href=current.path;selected=-1;$('editForm').classList.add('hidden');loadFrame()}function loadFrame(){$('preview').src=current.path+(current.path.includes('?')?'&':'?')+'cms_preview='+Date.now()}$('preview').onload=()=>{try{const d=$('preview').contentDocument;nodes=[...d.querySelectorAll(selector)].filter(el=>!el.closest('script,style,form')&&!el.matches('[data-cms-ignore]'));nodes.forEach((el,i)=>{el.style.cursor='pointer';el.dataset.cmsIndex=i;el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();select(i)})});renderItems()}catch(e){show('err','Preview could not be made editable.')}};function renderItems(){$('items').innerHTML=nodes.map((el,i)=>`<div class="item ${i===selected?'active':''}" data-i="${i}"><div class="tag">${el.tagName.toLowerCase()} #${i+1}</div><p>${escapeHtml(el.textContent.trim())||'(empty)'}</p></div>`).join('');$('items').querySelectorAll('.item').forEach(x=>x.onclick=()=>select(+x.dataset.i))}function escapeHtml(s){return String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function select(i){nodes.forEach(n=>n.classList.remove('selected-outline'));selected=i;const el=nodes[i];if(!el)return;el.classList.add('selected-outline');el.scrollIntoView({behavior:'smooth',block:'center'});$('editTitle').textContent='Editing item '+(i+1);$('editTag').textContent=el.tagName.toLowerCase();$('editText').value=el.textContent.trim();const isLink=el.tagName==='A';$('linkFields').classList.toggle('hidden',!isLink);$('editHref').value=isLink?el.getAttribute('href')||'':'';$('editForm').classList.remove('hidden');renderItems()}$('apply').onclick=()=>{if(selected<0)return;const el=nodes[selected],text=$('editText').value;el.textContent=text;let o={i:selected,text};if(el.tagName==='A'){o.href=$('editHref').value.trim();if(o.href)el.setAttribute('href',o.href)}const at=overrides.findIndex(x=>x.i===selected);if(at>=0)overrides[at]=o;else overrides.push(o);renderItems();show('ok','Applied to preview. Publish when ready.')};$('revert').onclick=()=>{if(selected<0)return;overrides=overrides.filter(x=>x.i!==selected);loadFrame();show('ok','Item reverted to built-in page content.')};$('reset').onclick=()=>{if(!confirm('Remove all body-content edits for this page?'))return;overrides=[];loadFrame();show('ok','Body edits cleared in preview. Click Publish to make it live.')};$('publish').onclick=async()=>{if(!current)return;const payload={content_overrides:overrides,page_title:$('pageTitle').value.trim()||null,meta_description:$('meta').value.trim()||null,updated_at:new Date().toISOString()};const r=await sb.from('website_pages').update(payload).eq('path',current.path);if(r.error)return show('err',r.error.message);Object.assign(current,payload);show('ok','Page changes published live.');loadFrame()};boot();</script></body></html>
