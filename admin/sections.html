<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Section Controls | Lake James Admin</title><link rel="stylesheet" href="/style.css"><style>body{background:#f4f4f2;margin:0}.shell{max-width:1400px;margin:auto;padding:24px 3%}.hidden{display:none!important}.login,.panel{background:#fff;border:1px solid #ddd;border-radius:12px;padding:22px}.login{max-width:430px;margin:80px auto}.top,.bar,.section{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top{justify-content:space-between}.bar{margin:14px 0;background:#fff;padding:14px;border-radius:10px}.bar select{min-width:280px}.grid{display:grid;grid-template-columns:390px 1fr;gap:16px}.sections{max-height:calc(100vh - 220px);overflow:auto}.section{border:1px solid #ddd;border-radius:9px;padding:12px;margin:8px 0;background:#fff}.section .name{flex:1;min-width:160px}.section.hiddenrow{opacity:.55}.frame{background:#222;padding:10px;border-radius:12px}.frame iframe{width:100%;height:calc(100vh - 205px);min-height:700px;border:0;background:#fff;border-radius:7px}.notice{display:none;padding:10px;border-radius:7px;background:#e8f7ef;margin:8px 0}.error{background:#fdebea}.status{font-size:11px;font-weight:900;padding:6px 9px;border-radius:20px;background:#eee}.muted{font-size:13px;color:#666}.move{min-width:36px}@media(max-width:900px){.grid{grid-template-columns:1fr}.sections{max-height:none}}</style></head><body><div id="login" class="login"><h1>Section Controls</h1><p>Sign in with your Lake James admin account.</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="signin" class="btn">Sign In</button><div id="loginerr" class="notice error"></div></div><main id="app" class="shell hidden"><div class="top"><div><h1>Section Controls</h1><p class="muted">Hide, show, and reorder page sections without editing code.</p></div><div><span id="status" class="status">LIVE</span> <a class="btn secondary" href="/admin/full-cms.html">Visual Editor</a> <a class="btn secondary" href="/admin/website.html">Website Manager</a> <button id="signout" class="btn secondary">Sign Out</button></div></div><div id="ok" class="notice"></div><div id="err" class="notice error"></div><div class="bar"><label>Page</label><select id="page"></select><button id="save" class="btn secondary">Save Draft</button><button id="publish" class="btn">Publish Live</button><button id="reset" class="btn secondary">Reset Order</button></div><div class="grid"><aside class="panel"><h3>Page Sections</h3><p class="muted">Hero areas stay controlled by Website Manager and are intentionally excluded.</p><div id="sections" class="sections"></div></aside><section class="frame"><iframe id="preview"></iframe></section></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij',{auth:{persistSession:true}}),$=id=>document.getElementById(id);let pages=[],current=null,base=[],sections=[];const hero='.hero,.pagehero,.pageHero,.projectHero,.serviceHero,.locationHero,[data-site-hero]';const esc=s=>String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function keyOf(el){if(el.dataset.cmsSection)return el.dataset.cmsSection;const parts=[];let n=el;while(n&&n.nodeType===1){if(n.id){parts.unshift('#'+CSS.escape(n.id));break}let seg=n.tagName.toLowerCase(),p=n.parentElement;if(p){const same=[...p.children].filter(x=>x.tagName===n.tagName);if(same.length>1)seg+=`:nth-of-type(${same.indexOf(n)+1})`}parts.unshift(seg);if(n.matches('main'))break;n=p}return parts.join('>')}function show(id,t){$(id).textContent=t;$(id).style.display='block';setTimeout(()=>$(id).style.display='none',4000)}async function boot(){const u=await sb.auth.getUser();if(!u.data.user)return;const p=await sb.from('profiles').select('role').eq('id',u.data.user.id).single();if(p.error||p.data?.role!=='admin'){await sb.auth.signOut();return show('loginerr','Internal admin access required.')}$('login').classList.add('hidden');$('app').classList.remove('hidden');const r=await sb.from('website_pages').select('*').order('page_group').order('label');if(r.error)return show('err',r.error.message);pages=r.data||[];$('page').innerHTML=pages.map((x,i)=>`<option value="${i}">${esc(x.page_group)} — ${esc(x.label)}</option>`).join('');choose(0)}$('signin').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return show('loginerr',r.error.message);boot()};$('signout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('page').onchange=()=>choose(+$('page').value);function choose(i){current=pages[i];const hasDraft=Array.isArray(current.draft_section_overrides)&&current.draft_section_overrides.length>0;sections=structuredClone(hasDraft?current.draft_section_overrides:(current.section_overrides||[]));$('status').textContent=hasDraft?'DRAFT':'LIVE';load()}function load(){$('preview').src=current.path+'?section_preview='+Date.now()}$('preview').onload=()=>{try{const d=$('preview').contentDocument,m=d.querySelector('main');base=[...m.children].filter(el=>el.nodeType===1&&!el.matches(hero)&&!el.matches('[data-cms-ignore]')).map((el,i)=>({key:keyOf(el),i,label:(el.querySelector('h1,h2,h3')?.textContent||el.getAttribute('aria-label')||el.className||`Section ${i+1}`).trim().slice(0,70)}));if(!sections.length)sections=base.map(x=>({...x,hidden:false}));else{const known=new Set(sections.map(x=>x.key));base.filter(x=>!known.has(x.key)).forEach(x=>sections.push({...x,hidden:false}))}render();applyPreview()}catch(e){show('err','Could not identify sections on this page.')}}function render(){$('sections').innerHTML=sections.map((s,i)=>`<div class="section ${s.hidden?'hiddenrow':''}"><button class="move up" data-i="${i}" ${i===0?'disabled':''}>↑</button><button class="move down" data-i="${i}" ${i===sections.length-1?'disabled':''}>↓</button><div class="name"><b>${esc(s.label||'Section '+(i+1))}</b><div class="muted">${esc(s.key)}</div></div><button class="toggle btn secondary" data-i="${i}">${s.hidden?'Show':'Hide'}</button></div>`).join('');document.querySelectorAll('.up').forEach(b=>b.onclick=()=>move(+b.dataset.i,-1));document.querySelectorAll('.down').forEach(b=>b.onclick=()=>move(+b.dataset.i,1));document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{const s=sections[+b.dataset.i];s.hidden=!s.hidden;dirty();render();applyPreview()})}function move(i,d){const j=i+d;if(j<0||j>=sections.length)return;[sections[i],sections[j]]=[sections[j],sections[i]];dirty();render();applyPreview()}function dirty(){$('status').textContent='UNSAVED'}function applyPreview(){const d=$('preview').contentDocument,m=d?.querySelector('main');if(!m)return;const els=[...m.children].filter(el=>el.nodeType===1&&!el.matches(hero)&&!el.matches('[data-cms-ignore]')),map=new Map(els.map((el,i)=>[keyOf(el),el]));for(const s of sections){const el=map.get(s.key)||els[s.i];if(el)el.style.display=s.hidden?'none':''}sections.map(s=>map.get(s.key)||els[s.i]).filter(Boolean).forEach(el=>m.appendChild(el))}$('reset').onclick=()=>{sections=base.map(x=>({...x,hidden:false}));dirty();render();applyPreview()};$('save').onclick=async()=>{const payload={draft_section_overrides:sections,updated_at:new Date().toISOString()},r=await sb.from('website_pages').update(payload).eq('path',current.path);if(r.error)return show('err',r.error.message);Object.assign(current,payload);$('status').textContent='DRAFT';show('ok','Section draft saved. Live page unchanged.')};$('publish').onclick=async()=>{if(!confirm('Publish this section order and visibility to the live website?'))return;const old={page_path:current.path,content_overrides:current.content_overrides||[],section_overrides:current.section_overrides||[],page_title:current.page_title||null,meta_description:current.meta_description||null};const rr=await sb.from('website_page_revisions').insert(old);if(rr.error)return show('err',rr.error.message);const payload={section_overrides:sections,draft_section_overrides:[],updated_at:new Date().toISOString()},r=await sb.from('website_pages').update(payload).eq('path',current.path);if(r.error)return show('err',r.error.message);Object.assign(current,payload);$('status').textContent='LIVE';show('ok','Section controls published live. Previous version saved.');load()};window.addEventListener('beforeunload',e=>{if($('status').textContent==='UNSAVED'){e.preventDefault();e.returnValue=''}});boot();</script></body></html>
