<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Master Price Book | Lake James</title><link rel="stylesheet" href="/style.css"><style>.wrap{max-width:1100px;margin:40px auto;padding:0 5%}.box{background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}input{min-width:90px}.money{width:120px}.save{margin-top:20px}</style></head><body><main class="wrap"><a href="/admin/leads.html">← Admin</a><h1>Lake James Master Price Book</h1><p>Update costs here once. New quotes can pull these values automatically while allowing job-specific overrides.</p><div id="msg"></div><div class="box"><table><thead><tr><th>Category</th><th>Cost Item</th><th>Unit</th><th>Current Cost / Default</th><th>Notes</th></tr></thead><tbody id="rows"></tbody></table><button id="save" class="btn save">Save Price Book</button></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij'),rows=document.getElementById('rows'),msg=document.getElementById('msg');let data=[];async function load(){let{data:{user}}=await sb.auth.getUser();if(!user)return location.href='/admin/leads.html';let r=await sb.from('estimating_price_book').select('*').eq('is_active',true).order('category').order('label');if(r.error){msg.textContent=r.error.message;return}data=r.data;rows.innerHTML=data.map(x=>`<tr><td>${x.category}</td><td><b>${x.label}</b></td><td>${x.unit}</td><td><input class="money" type="number" step="0.01" data-id="${x.id}" value="${x.cost}"></td><td><input data-note="${x.id}" value="${(x.notes||'').replace(/"/g,'&quot;')}"></td></tr>`).join('')}document.getElementById('save').onclick=async()=>{msg.textContent='Saving…';for(let x of data){let cost=+document.querySelector(`[data-id="${x.id}"]`).value||0,note=document.querySelector(`[data-note="${x.id}"]`).value,r=await sb.from('estimating_price_book').update({cost,notes:note,updated_at:new Date().toISOString()}).eq('id',x.id);if(r.error){msg.textContent=r.error.message;return}}msg.textContent='Master price book saved. New quotes will use these defaults.'};load();</script></body></html>
