<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Go-Live Readiness | Lake James</title><link rel="stylesheet" href="/style.css"><style>body{background:#f4f4f2}.hidden{display:none!important}.wrap{max-width:1100px;margin:35px auto;padding:22px}.panel{background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px;margin:14px 0}.top,.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.meter{height:18px;background:#e6e8e6;border-radius:99px;overflow:hidden}.meter div{height:100%;background:#26362d}.item{display:grid;grid-template-columns:180px 1fr 160px;gap:12px;padding:14px 0;border-bottom:1px solid #eee}.pass{color:#18794e}.blocked{color:#b42318}.muted{color:#667085;font-size:13px}select,textarea{width:100%;padding:9px}.login{max-width:430px;margin:80px auto;padding:28px;background:#fff;border:1px solid #ddd;border-radius:12px}@media(max-width:700px){.item{grid-template-columns:1fr}}</style></head><body><div id="login" class="login"><h1>Lake James Admin</h1><p>Go-Live Readiness</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin" class="btn">Sign In</button><p id="loginerr" class="blocked"></p></div><main id="app" class="wrap hidden"><div class="top"><div><h1>Customer Go-Live</h1><p class="muted">Nothing goes live until every required control passes.</p></div><div><a class="btn secondary" href="/admin/">Admin Home</a> <button id="signout" class="btn secondary">Sign Out</button></div></div><section class="panel"><label>Customer</label><select id="org"></select><div class="top"><h2 id="state">—</h2><b id="pct">0%</b></div><div class="meter"><div id="bar" style="width:0%"></div></div></section><section id="items" class="panel"></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij',{auth:{persistSession:true}}),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));let rows=[];async function boot(){const u=(await sb.auth.getUser()).data.user;if(!u)return;const p=await sb.from('profiles').select('role').eq('id',u.id).single();if(p.data?.role!=='admin'){await sb.auth.signOut();return $('loginerr').textContent='Admin access required.'}$('login').classList.add('hidden');$('app').classList.remove('hidden');const o=await sb.from('organizations').select('id,name').eq('organization_type','customer').eq('active',true).order('name');$('org').innerHTML=(o.data||[]).filter(x=>!x.name.startsWith('LJC 10-Location Pilot Simulation')&&!x.name.startsWith('DEMO')).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');load()}$('signin').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return $('loginerr').textContent=r.error.message;boot()};$('signout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('org').onchange=load;async function load(){const oid=$('org').value;if(!oid)return;await sb.rpc('fm_initialize_go_live_checklist',{p_organization_id:oid});const [r,s]=await Promise.all([sb.from('go_live_checklist').select('*').eq('organization_id',oid).order('category').order('created_at'),sb.from('go_live_readiness').select('*').eq('organization_id',oid).single()]);rows=r.data||[];const x=s.data||{};$('state').textContent=x.readiness_status||'IN PROGRESS';$('state').className=(x.readiness_status==='READY'?'pass':x.readiness_status==='BLOCKED'?'blocked':'');$('pct').textContent=(x.readiness_percent||0)+'%';$('bar').style.width=(x.readiness_percent||0)+'%';render()}function render(){$('items').innerHTML=rows.map(x=>`<div class="item"><div><b>${esc(x.category)}</b><br><span class="muted">${x.required?'Required':'Optional'}</span></div><div><b>${esc(x.item_label)}</b><textarea id="n-${x.id}" placeholder="Verification notes">${esc(x.notes||'')}</textarea></div><div><select id="s-${x.id}"><option value="pending" ${x.status==='pending'?'selected':''}>Pending</option><option value="pass" ${x.status==='pass'?'selected':''}>Pass</option><option value="blocked" ${x.status==='blocked'?'selected':''}>Blocked</option><option value="not_applicable" ${x.status==='not_applicable'?'selected':''}>N/A</option></select><button class="btn secondary" style="margin-top:8px" onclick="window.save('${x.id}')">Save</button></div></div>`).join('')}window.save=async id=>{const r=await sb.from('go_live_checklist').update({status:$('s-'+id).value,notes:$('n-'+id).value,checked_at:new Date().toISOString(),checked_by:(await sb.auth.getUser()).data.user.id}).eq('id',id);if(r.error)return alert(r.error.message);load()};boot();</script></body></html>
