<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Manager | Lake James Admin</title><link rel="stylesheet" href="/style.css"><style>.admin{max-width:1400px;margin:auto;padding:32px 4%}.hidden{display:none!important}.login{max-width:430px;margin:80px auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.adminnav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 25px;padding:12px;background:#f4f4f2;border:1px solid #ddd;border-radius:10px}.editor{display:grid;grid-template-columns:minmax(340px,.8fr) minmax(480px,1.2fr);gap:22px}.panel{border:1px solid #ddd;border-radius:12px;padding:22px;background:#fff}.panel h2{font-size:25px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.uploadbox{border:1px dashed #aaa;border-radius:10px;padding:14px;background:#fafafa;margin-bottom:14px}.preview{position:sticky;top:105px;overflow:hidden;border-radius:12px;background:#111;color:#fff;min-height:600px;box-shadow:0 18px 45px rgba(0,0,0,.15)}.phead{height:76px;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;background:#0a0a0b}.phead img{max-height:55px;max-width:230px;object-fit:contain}.pnav{font-size:11px;font-weight:800;color:#ddd}.phero{min-height:524px;padding:65px 8%;display:flex;align-items:center;background-size:cover;background-position:center}.phero>div{max-width:700px}.phero h1{font-size:clamp(36px,4vw,58px);line-height:1;letter-spacing:-1.5px;color:#fff;margin:12px 0 18px}.phero p{color:#eee;font-size:17px}.peyebrow{text-transform:uppercase;font-size:10px;letter-spacing:1.5px;font-weight:900}.pbtn{display:inline-block;padding:12px 16px;margin:8px 6px 0 0;border-radius:5px;background:#fff;color:#111;font-weight:900;font-size:12px}.pbtn.alt{background:rgba(0,0,0,.35);color:#fff;border:1px solid #fff}.notice{display:none;padding:11px;border-radius:8px;background:#e8f7ef;margin:10px 0}.error{background:#fdebea}.media{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;max-height:330px;overflow:auto}.media button{border:2px solid transparent;padding:0;background:none;cursor:pointer;border-radius:8px;overflow:hidden}.media button:hover{border-color:#222}.media img{display:block;width:100%;height:90px;object-fit:cover}.range{display:flex;gap:10px;align-items:center}.range input{margin:0}.muted{color:#6b6b6b}@media(max-width:900px){.editor{grid-template-columns:1fr}.preview{position:static}.row{grid-template-columns:1fr}.media{grid-template-columns:repeat(2,1fr)}}</style></head><body><div id="login" class="login formbox"><h1>Website Manager</h1><p>Sign in with your Lake James admin account.</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="signin" class="btn">Sign In</button><div id="loginerr" class="notice error"></div></div><main id="app" class="admin hidden"><div class="top"><div><h1>Website Manager</h1><p class="muted">Change the visual side of the public website without editing GitHub files.</p></div><button id="signout" class="btn secondary">Sign Out</button></div><nav class="adminnav"><a class="btn secondary" href="/admin/leads.html">Lead Pipeline</a><a class="btn secondary" href="/admin/price-book.html">Master Estimating</a><a class="btn" href="/admin/website.html">Website Manager</a><a class="btn secondary" href="/" target="_blank">Open Website ↗</a></nav><div id="ok" class="notice"></div><div id="err" class="notice error"></div><div class="editor"><section class="panel"><h2>Brand & Hero</h2><label>Logo</label><div class="uploadbox"><input id="logoFile" type="file" accept="image/*"><button id="uploadLogo" class="btn secondary" type="button">Upload & Use Logo</button></div><label>Hero Photo</label><div class="uploadbox"><input id="heroFile" type="file" accept="image/*"><button id="uploadHero" class="btn secondary" type="button">Upload & Use Hero Photo</button><div id="media" class="media"></div></div><label>Eyebrow</label><input id="eyebrow"><label>Main Headline</label><textarea id="headline"></textarea><label>Subheadline</label><textarea id="subheadline"></textarea><div class="row"><div><label>Primary Button</label><input id="primaryText"></div><div><label>Primary Link</label><input id="primaryHref"></div></div><div class="row"><div><label>Secondary Button</label><input id="secondaryText"></div><div><label>Secondary Link</label><input id="secondaryHref"></div></div><div class="row"><div><label>Header Color</label><input id="headerColor" type="color"></div><div><label>Button / Accent Color</label><input id="accentColor" type="color"></div></div><label>Hero Image Darkness</label><div class="range"><input id="overlay" type="range" min="0" max="95"><b id="overlayVal">72%</b></div><button id="save" class="btn" type="button">Publish Website Changes</button></section><section><div class="preview"><div id="phead" class="phead"><img id="plogo" alt="Lake James Canopies logo"><div class="pnav">SERVICES &nbsp; PROJECTS &nbsp; SERVICE AREA &nbsp; REQUEST ASSESSMENT</div></div><div id="phero" class="phero"><div><div id="peyebrow" class="peyebrow"></div><h1 id="pheadline"></h1><p id="psubheadline"></p><span id="pprimary" class="pbtn"></span><span id="psecondary" class="pbtn alt"></span></div></div></div></section></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij',{auth:{persistSession:true}}),$=x=>document.getElementById(x);let settings={};function show(id,t){$(id).textContent=t;$(id).style.display='block';setTimeout(()=>$(id).style.display='none',4500)}async function boot(){let u=await sb.auth.getUser();if(!u.data.user)return;let p=await sb.from('profiles').select('role').eq('id',u.data.user.id).single();if(p.error||p.data?.role!=='admin'){await sb.auth.signOut();return show('loginerr','Internal admin access required.')}$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}$('signin').onclick=async()=>{let r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return show('loginerr',r.error.message);boot()};$('signout').onclick=async()=>{await sb.auth.signOut();location.reload()};async function load(){let r=await sb.from('website_visual_settings').select('*').eq('id',1).single();if(r.error)return show('err',r.error.message);settings=r.data;const map={eyebrow:'hero_eyebrow',headline:'hero_headline',subheadline:'hero_subheadline',primaryText:'primary_cta_text',primaryHref:'primary_cta_href',secondaryText:'secondary_cta_text',secondaryHref:'secondary_cta_href',headerColor:'header_background',accentColor:'accent_color',overlay:'hero_overlay'};Object.entries(map).forEach(([id,key])=>$(id).value=settings[key]??'');$('overlayVal').textContent=settings.hero_overlay+'%';await media();preview()}function preview(){let o=+$('overlay').value/100,img=settings.hero_image_url||'/images/projects/hero-canopy.jpg';$('phead').style.background=$('headerColor').value;$('plogo').src=settings.logo_url||'/logo_inverted.png';$('phero').style.backgroundImage=`linear-gradient(90deg,rgba(0,0,0,${Math.min(.95,o+.12)}),rgba(0,0,0,${Math.max(0,o-.25)})),url("${img}")`;$('peyebrow').textContent=$('eyebrow').value;$('pheadline').textContent=$('headline').value;$('psubheadline').textContent=$('subheadline').value;$('pprimary').textContent=$('primaryText').value;$('pprimary').style.background=$('accentColor').value;$('pprimary').style.color='#fff';$('psecondary').textContent=$('secondaryText').value;$('overlayVal').textContent=$('overlay').value+'%'}document.querySelectorAll('input,textarea').forEach(x=>x.addEventListener('input',preview));$('save').onclick=async()=>{let payload={hero_eyebrow:$('eyebrow').value.trim(),hero_headline:$('headline').value.trim(),hero_subheadline:$('subheadline').value.trim(),primary_cta_text:$('primaryText').value.trim(),primary_cta_href:$('primaryHref').value.trim(),secondary_cta_text:$('secondaryText').value.trim(),secondary_cta_href:$('secondaryHref').value.trim(),header_background:$('headerColor').value,accent_color:$('accentColor').value,hero_overlay:+$('overlay').value,updated_at:new Date().toISOString()};let r=await sb.from('website_visual_settings').update(payload).eq('id',1);if(r.error)return show('err',r.error.message);Object.assign(settings,payload);show('ok','Published. Refresh the public website to see the changes.')}async function upload(file,type){if(!file)return show('err','Choose an image first.');if(file.size>10*1024*1024)return show('err','Image must be under 10 MB.');let safe=(Date.now()+'-'+file.name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-'));let r=await sb.storage.from('website-media').upload(safe,file,{upsert:false});if(r.error)return show('err',r.error.message);let url=sb.storage.from('website-media').getPublicUrl(safe).data.publicUrl,key=type==='logo'?'logo_url':'hero_image_url';let u=await sb.from('website_visual_settings').update({[key]:url,updated_at:new Date().toISOString()}).eq('id',1);if(u.error)return show('err',u.error.message);settings[key]=url;await media();preview();show('ok',type==='logo'?'Logo updated.':'Hero photo updated.')}$('uploadLogo').onclick=()=>upload($('logoFile').files[0],'logo');$('uploadHero').onclick=()=>upload($('heroFile').files[0],'hero');async function media(){let r=await sb.storage.from('website-media').list('',{limit:100,sortBy:{column:'created_at',order:'desc'}});if(r.error)return;let imgs=(r.data||[]).filter(x=>!x.name.startsWith('.'));$('media').innerHTML=imgs.map(x=>{let url=sb.storage.from('website-media').getPublicUrl(x.name).data.publicUrl;return `<button type="button" data-url="${url.replaceAll('&','&amp;').replaceAll('"','&quot;')}" title="Use as hero"><img src="${url.replaceAll('&','&amp;').replaceAll('"','&quot;')}" alt="Website media"></button>`}).join('');$('media').querySelectorAll('button').forEach(b=>b.onclick=async()=>{settings.hero_image_url=b.dataset.url;let u=await sb.from('website_visual_settings').update({hero_image_url:settings.hero_image_url,updated_at:new Date().toISOString()}).eq('id',1);if(u.error)return show('err',u.error.message);preview();show('ok','Hero image changed.')})}(async()=>{let s=await sb.auth.getSession();if(s.data.session)boot()})();</script></body></html>
