<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Proposal | Lake James Admin</title><link rel="stylesheet" href="/style.css"><style>.q{max-width:1000px;margin:40px auto;padding:0 5%}.box{background:white;border:1px solid #ddd;border-radius:12px;padding:22px;margin-bottom:20px}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}textarea{min-height:150px}.total{font-size:24px;font-weight:bold;text-align:right;margin:15px 0}@media(max-width:750px){.row,.row4{grid-template-columns:1fr}}</style></head><body><main class="q"><a href="/admin/leads.html">← Lead Pipeline</a><h1>Create Lake James Proposal</h1><div id="msg"></div><div class="box"><h2 id="customer">Loading lead…</h2><label>Proposal Title</label><input id="title" value="Gas Station Canopy Proposal"><label>Scope of Work</label><textarea id="scope"></textarea><div class="row"><div><label>Subtotal</label><input id="subtotal" type="number" step="0.01" value="0"></div><div><label>Tax / Other</label><input id="tax" type="number" step="0.01" value="0"></div></div><div class="total">Total: <span id="total">$0.00</span></div></div><div class="box"><h2>Canopy Geometry & Drawing Inputs</h2><div class="row4"><div><label>Length (ft)</label><input id="length" type="number" step="0.1"></div><div><label>Width (ft)</label><input id="width" type="number" step="0.1"></div><div><label>Clear Height (ft)</label><input id="height" type="number" step="0.1"></div><div><label>Fascia Height (in)</label><input id="fascia" type="number" step="0.1"></div><div><label>Roof Slope (in/ft)</label><input id="slope" type="number" step="0.125" value="0"></div><div><label>Column Count</label><input id="columns" type="number" min="0"></div><div><label>Column Size (in)</label><input id="columnSize" type="number" step="0.1"></div><div><label>Length Inset (ft)</label><input id="insetL" type="number" step="0.1"></div><div><label>Width Inset (ft)</label><input id="insetW" type="number" step="0.1"></div><div><label>Downspouts</label><input id="downspouts" type="number" min="0" value="0"></div><div><label>Light Fixtures</label><input id="lights" type="number" min="0" value="0"></div><div><label>Light Rows</label><input id="lightRows" type="number" min="1" value="1"></div><div><label>Logo Panels</label><input id="logos" type="number" min="0" value="0"></div><div><label>Logo Width (ft)</label><input id="logoW" type="number" step="0.1"></div><div><label>Logo Height (ft)</label><input id="logoH" type="number" step="0.1"></div></div><div class="row"><div><label>Column Layout</label><select id="layout"><option value="even">Evenly spaced</option><option value="centerline">Centerline</option></select></div><div><label>Drainage</label><select id="gutter"><option value="none">None / not specified</option><option value="internal">Internal</option><option value="external">External</option></select></div><div><label>Roof Material</label><input id="roofMaterial" placeholder="e.g. metal deck / membrane"></div><div><label>Fascia Material</label><input id="fasciaMaterial" placeholder="e.g. ACM / metal panel"></div><div><label>Soffit Material</label><input id="soffitMaterial" placeholder="e.g. metal soffit"></div></div><label>Drawing Notes</label><textarea id="drawingNotes" style="min-height:80px"></textarea><button id="saveDrawing" class="btn">Save & Open Drawing Package</button></div><div class="box"><label>Terms</label><textarea id="terms" style="min-height:110px">Pricing is based on the scope described above and is subject to site conditions, final measurements, material availability, and written change orders. Payment terms and project scheduling will be confirmed before work begins.</textarea><button id="save" class="btn">Save Draft</button> <button id="send" class="btn">Save & Send Proposal</button></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij'),$=x=>document.getElementById(x),leadId=new URLSearchParams(location.search).get('lead');let quoteId=null,lead=null;const money=x=>Number(x||0).toLocaleString('en-US',{style:'currency',currency:'USD'}),n=id=>+$(id).value||0;function calc(){$('total').textContent=money(n('subtotal')+n('tax'))}$('subtotal').oninput=$('tax').oninput=calc;const map={title:'title',scope:'scope',subtotal:'subtotal',tax:'tax',terms:'terms',canopy_length_ft:'length',canopy_width_ft:'width',canopy_height_ft:'height',fascia_height_in:'fascia',roof_slope_in_per_ft:'slope',column_count:'columns',column_size_in:'columnSize',column_inset_length_ft:'insetL',column_inset_width_ft:'insetW',column_layout:'layout',gutter_type:'gutter',downspout_count:'downspouts',lighting_count:'lights',light_rows:'lightRows',logo_panel_count:'logos',logo_panel_width_ft:'logoW',logo_panel_height_ft:'logoH',roof_material:'roofMaterial',fascia_material:'fasciaMaterial',soffit_material:'soffitMaterial',drawing_notes:'drawingNotes'};async function init(){let{data:{user}}=await sb.auth.getUser();if(!user)return location.href='/admin/leads.html';let r=await sb.from('canopy_assessment_leads').select('*').eq('id',leadId).single();if(r.error){$('msg').textContent=r.error.message;return}lead=r.data;$('customer').textContent=(lead.company_name||lead.station_name||lead.contact_name)+' — '+lead.contact_name;$('scope').value=lead.issue_description||'';let q=await sb.from('lead_quotes').select('*').eq('lead_id',leadId).order('created_at',{ascending:false}).limit(1).maybeSingle();if(q.data){quoteId=q.data.id;for(let[k,id]of Object.entries(map))if(q.data[k]!=null)$(id).value=q.data[k]}calc()}async function save(){let payload={lead_id:leadId,updated_at:new Date().toISOString()};for(let[k,id]of Object.entries(map)){if(['title','scope','terms','column_layout','gutter_type','roof_material','fascia_material','soffit_material','drawing_notes'].includes(k))payload[k]=$(id).value;else payload[k]=n(id)}let r=quoteId?await sb.from('lead_quotes').update(payload).eq('id',quoteId).select().single():await sb.from('lead_quotes').insert(payload).select().single();if(r.error)throw r.error;quoteId=r.data.id;return r.data}$('save').onclick=async()=>{try{await save();$('msg').textContent='Draft and drawing data saved.'}catch(e){$('msg').textContent=e.message}};$('saveDrawing').onclick=async()=>{try{if(!n('length')||!n('width')||!n('height'))throw Error('Enter length, width and clear height first.');await save();location.href='/admin/drawing.html?lead='+encodeURIComponent(leadId)}catch(e){$('msg').textContent=e.message}};$('send').onclick=async()=>{if(!confirm('Send this proposal to '+lead.email+'?'))return;try{await save();let r=await sb.functions.invoke('send-quote',{body:{id:quoteId}});if(r.error)throw r.error;$('msg').textContent='Proposal sent to '+lead.email+'.'}catch(e){$('msg').textContent='Could not send: '+e.message}};init();</script></body></html>
