<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Proposal | Lake James Admin</title><link rel="stylesheet" href="/style.css"><style>.q{max-width:1000px;margin:40px auto;padding:0 5%}.box{background:white;border:1px solid #ddd;border-radius:12px;padding:22px;margin-bottom:20px}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}textarea{min-height:150px}.total{font-size:24px;font-weight:bold;text-align:right;margin:15px 0}.drawing{border:1px solid #bbb;background:#fff;padding:15px;margin-top:15px}.sheet{font-family:Arial,sans-serif;color:#111}.sheet h2,.sheet h3{margin:4px 0}.views{display:grid;grid-template-columns:1fr 1fr;gap:18px}.view{border:1px solid #777;padding:8px}.view svg{width:100%;height:300px}.titleblock{border:2px solid #111;padding:10px;display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:15px;font-size:12px}.dim{font-size:12px}.warn{font-size:12px;margin-top:10px;font-weight:bold}@media(max-width:750px){.row,.row4,.views{grid-template-columns:1fr}}@media print{body *{visibility:hidden}.sheet,.sheet *{visibility:visible}.sheet{position:absolute;left:0;top:0;width:100%;padding:15px}.no-print{display:none!important}}</style></head><body><main class="q"><a href="/admin/leads.html">← Lead Pipeline</a><h1>Create Lake James Proposal</h1><div id="msg"></div><div class="box"><h2 id="customer">Loading lead…</h2><label>Proposal Title</label><input id="title" value="Gas Station Canopy Proposal"><label>Scope of Work</label><textarea id="scope"></textarea><div class="row"><div><label>Subtotal</label><input id="subtotal" type="number" step="0.01" value="0"></div><div><label>Tax / Other</label><input id="tax" type="number" step="0.01" value="0"></div></div><div class="total">Total: <span id="total">$0.00</span></div></div><div class="box"><h2>Drawing Inputs</h2><p>These values drive the automatic plan and elevation drawings.</p><div class="row4"><div><label>Length (ft)</label><input id="length" type="number" step="0.1"></div><div><label>Width (ft)</label><input id="width" type="number" step="0.1"></div><div><label>Clear Height (ft)</label><input id="height" type="number" step="0.1"></div><div><label>Fascia Height (in)</label><input id="fascia" type="number" step="0.1"></div><div><label>Column Count</label><input id="columns" type="number" min="0"></div><div><label>Downspouts</label><input id="downspouts" type="number" min="0" value="0"></div><div><label>Light Fixtures</label><input id="lights" type="number" min="0" value="0"></div><div><label>Logo Panels</label><input id="logos" type="number" min="0" value="0"></div></div><div class="row"><div><label>Column Layout</label><select id="layout"><option value="even">Evenly spaced</option><option value="centerline">Centerline</option></select></div><div><label>Drainage</label><select id="gutter"><option value="none">None / not specified</option><option value="internal">Internal</option><option value="external">External</option></select></div></div><label>Drawing Notes</label><textarea id="drawingNotes" style="min-height:80px"></textarea><button id="generate" class="btn" type="button">Generate Drawings</button></div><div id="drawing" class="drawing" style="display:none"></div><div class="box no-print"><label>Terms</label><textarea id="terms" style="min-height:110px">Pricing is based on the scope described above and is subject to site conditions, final measurements, material availability, and written change orders. Payment terms and project scheduling will be confirmed before work begins.</textarea><button id="save" class="btn">Save Draft</button> <button id="print" class="btn">Print / Save Drawing PDF</button> <button id="send" class="btn">Save & Send Proposal</button></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij'),$=x=>document.getElementById(x),leadId=new URLSearchParams(location.search).get('lead');let quoteId=null,lead=null;const money=x=>Number(x||0).toLocaleString('en-US',{style:'currency',currency:'USD'}),n=id=>+$ (id).value||0;function calc(){$('total').textContent=money(n('subtotal')+n('tax'))}$('subtotal').oninput=$('tax').oninput=calc;function circles(count,x,y,w,h){if(!count)return'';let a=[];for(let i=0;i<count;i++){let cols=Math.ceil(Math.sqrt(count)),rows=Math.ceil(count/cols),c=i%cols,r=Math.floor(i/cols),cx=x+(cols===1?w/2:c*w/(cols-1)),cy=y+(rows===1?h/2:r*h/(rows-1));a.push(`<circle cx="${cx}" cy="${cy}" r="5" fill="none" stroke="black" stroke-width="2"/>`)}return a.join('')}function generate(){let L=n('length'),W=n('width'),H=n('height'),F=n('fascia'),C=n('columns');if(!L||!W||!H){$('msg').textContent='Enter canopy length, width and clear height first.';return}let planW=440,planH=Math.max(120,440*W/L),maxH=260;if(planH>maxH){planW=planW*maxH/planH;planH=maxH}let x=(500-planW)/2,y=(300-planH)/2,frontW=440,roofY=65,ground=250,clear=ground-(roofY+(F/12)/(H+F/12)*(ground-roofY));let colXs=[];for(let i=0;i<C;i++)colXs.push(50+(C===1?frontW/2:i*frontW/(C-1)));$('drawing').style.display='block';$('drawing').innerHTML=`<div class="sheet"><h2>LAKE JAMES CANOPIES — QUOTE DRAWING</h2><p>${lead?.company_name||lead?.station_name||lead?.contact_name||''} · ${$('title').value}</p><div class="views"><div class="view"><h3>PLAN VIEW</h3><svg viewBox="0 0 500 340"><rect x="${x}" y="${y}" width="${planW}" height="${planH}" fill="none" stroke="black" stroke-width="2"/>${circles(C,x+planW*.15,y+planH*.2,planW*.7,planH*.6)}<line x1="${x}" y1="${y+planH+25}" x2="${x+planW}" y2="${y+planH+25}" stroke="black"/><text x="250" y="${y+planH+45}" text-anchor="middle" class="dim">${L}'-0&quot; LENGTH</text><line x1="${x-25}" y1="${y}" x2="${x-25}" y2="${y+planH}" stroke="black"/><text x="${x-35}" y="150" text-anchor="middle" transform="rotate(-90 ${x-35} 150)" class="dim">${W}'-0&quot; WIDTH</text></svg></div><div class="view"><h3>FRONT ELEVATION</h3><svg viewBox="0 0 500 340"><rect x="30" y="${roofY}" width="440" height="${Math.max(12,F/12/(H+F/12)*185)}" fill="none" stroke="black" stroke-width="2"/>${colXs.map(cx=>`<line x1="${cx}" y1="${roofY+Math.max(12,F/12/(H+F/12)*185)}" x2="${cx}" y2="${ground}" stroke="black" stroke-width="5"/>`).join('')}<line x1="20" y1="${ground}" x2="480" y2="${ground}" stroke="black"/><text x="250" y="290" text-anchor="middle" class="dim">${L}'-0&quot; OVERALL LENGTH</text><text x="15" y="160" class="dim">${H}' CLEAR</text><text x="250" y="55" text-anchor="middle" class="dim">FASCIA ${F}&quot;</text></svg></div></div><div class="titleblock"><div><strong>PROJECT:</strong> ${$('title').value}<br><strong>CUSTOMER:</strong> ${lead?.company_name||lead?.station_name||lead?.contact_name||''}<br><strong>LOCATION:</strong> ${lead?.site_address||lead?.address||''}<br><strong>NOTES:</strong> ${$('drawingNotes').value||'None'}</div><div><strong>CANOPY:</strong> ${L}' × ${W}'<br><strong>CLEAR HEIGHT:</strong> ${H}'<br><strong>COLUMNS:</strong> ${C}<br><strong>DRAINAGE:</strong> ${$('gutter').value}<br><strong>LIGHTS:</strong> ${n('lights')} · <strong>LOGOS:</strong> ${n('logos')}<br><strong>DATE:</strong> ${new Date().toLocaleDateString()}</div></div><div class="warn">PRELIMINARY SHOP / FIELD DRAWING — NOT FOR STRUCTURAL ENGINEERING, PERMITTING OR CONSTRUCTION UNTIL FIELD DIMENSIONS AND REQUIRED ENGINEERING ARE VERIFIED.</div></div>`}$('generate').onclick=generate;$('print').onclick=()=>{generate();setTimeout(()=>window.print(),100)};async function init(){let{data:{user}}=await sb.auth.getUser();if(!user)return location.href='/admin/leads.html';let r=await sb.from('canopy_assessment_leads').select('*').eq('id',leadId).single();if(r.error){$('msg').textContent=r.error.message;return}lead=r.data;$('customer').textContent=(lead.company_name||lead.station_name||lead.contact_name)+' — '+lead.contact_name;$('scope').value=lead.issue_description||'';let q=await sb.from('lead_quotes').select('*').eq('lead_id',leadId).order('created_at',{ascending:false}).limit(1).maybeSingle();if(q.data){quoteId=q.data.id;for(let[k,id]of Object.entries({title:'title',scope:'scope',subtotal:'subtotal',tax:'tax',terms:'terms',canopy_length_ft:'length',canopy_width_ft:'width',canopy_height_ft:'height',fascia_height_in:'fascia',column_count:'columns',column_layout:'layout',gutter_type:'gutter',downspout_count:'downspouts',lighting_count:'lights',logo_panel_count:'logos',drawing_notes:'drawingNotes'}))if(q.data[k]!=null)$(id).value=q.data[k]}calc()}async function save(){let payload={lead_id:leadId,title:$('title').value,scope:$('scope').value,subtotal:n('subtotal'),tax:n('tax'),terms:$('terms').value,canopy_length_ft:n('length')||null,canopy_width_ft:n('width')||null,canopy_height_ft:n('height')||null,fascia_height_in:n('fascia')||null,column_count:n('columns')||null,column_layout:$('layout').value,gutter_type:$('gutter').value,downspout_count:n('downspouts'),lighting_count:n('lights'),logo_panel_count:n('logos'),drawing_notes:$('drawingNotes').value,updated_at:new Date().toISOString()},r;if(quoteId)r=await sb.from('lead_quotes').update(payload).eq('id',quoteId).select().single();else r=await sb.from('lead_quotes').insert(payload).select().single();if(r.error)throw r.error;quoteId=r.data.id;return r.data}$('save').onclick=async()=>{try{await save();$('msg').textContent='Draft and drawing inputs saved.'}catch(e){$('msg').textContent=e.message}};$('send').onclick=async()=>{if(!confirm('Send this proposal to '+lead.email+'?'))return;try{await save();let r=await sb.functions.invoke('send-quote',{body:{id:quoteId}});if(r.error)throw r.error;$('msg').textContent='Proposal sent to '+lead.email+'.'}catch(e){$('msg').textContent='Could not send: '+e.message}};init();</script></body></html>
