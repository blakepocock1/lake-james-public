<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Proposal | Lake James Admin</title><link rel="stylesheet" href="/style.css"><style>.q{max-width:850px;margin:40px auto;padding:0 5%}.box{background:white;border:1px solid #ddd;border-radius:12px;padding:22px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}textarea{min-height:180px}.total{font-size:24px;font-weight:bold;text-align:right;margin:15px 0}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><main class="q"><a href="/admin/leads.html">← Lead Pipeline</a><h1>Create Lake James Proposal</h1><div id="msg"></div><div class="box"><h2 id="customer">Loading lead…</h2><label>Proposal Title</label><input id="title" value="Gas Station Canopy Proposal"><label>Scope of Work</label><textarea id="scope"></textarea><div class="row"><div><label>Subtotal</label><input id="subtotal" type="number" step="0.01" value="0"></div><div><label>Tax / Other</label><input id="tax" type="number" step="0.01" value="0"></div></div><div class="total">Total: <span id="total">$0.00</span></div><label>Terms</label><textarea id="terms" style="min-height:110px">Pricing is based on the scope described above and is subject to site conditions, final measurements, material availability, and written change orders. Payment terms and project scheduling will be confirmed before work begins.</textarea><button id="save" class="btn">Save Draft</button> <button id="send" class="btn">Save & Send Proposal</button></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij'),$=x=>document.getElementById(x),leadId=new URLSearchParams(location.search).get('lead');let quoteId=null,lead=null;const money=x=>Number(x||0).toLocaleString('en-US',{style:'currency',currency:'USD'});function calc(){$('total').textContent=money(+$('subtotal').value + +$('tax').value)}$('subtotal').oninput=$('tax').oninput=calc;async function init(){let{data:{user}}=await sb.auth.getUser();if(!user)return location.href='/admin/leads.html';let r=await sb.from('canopy_assessment_leads').select('*').eq('id',leadId).single();if(r.error){$('msg').textContent=r.error.message;return}lead=r.data;$('customer').textContent=(lead.company_name||lead.station_name||lead.contact_name)+' — '+lead.contact_name;$('scope').value=lead.issue_description||'';let q=await sb.from('lead_quotes').select('*').eq('lead_id',leadId).order('created_at',{ascending:false}).limit(1).maybeSingle();if(q.data){quoteId=q.data.id;$('title').value=q.data.title;$('scope').value=q.data.scope||'';$('subtotal').value=q.data.subtotal;$('tax').value=q.data.tax;$('terms').value=q.data.terms}calc()}async function save(){let payload={lead_id:leadId,title:$('title').value,scope:$('scope').value,subtotal:+$('subtotal').value||0,tax:+$('tax').value||0,terms:$('terms').value,updated_at:new Date().toISOString()},r;if(quoteId)r=await sb.from('lead_quotes').update(payload).eq('id',quoteId).select().single();else r=await sb.from('lead_quotes').insert(payload).select().single();if(r.error)throw r.error;quoteId=r.data.id;return r.data}$('save').onclick=async()=>{try{await save();$('msg').textContent='Draft saved.'}catch(e){$('msg').textContent=e.message}};$('send').onclick=async()=>{if(!confirm('Send this proposal to '+lead.email+'?'))return;try{await save();let r=await sb.functions.invoke('send-quote',{body:{id:quoteId}});if(r.error)throw r.error;$('msg').textContent='Proposal sent to '+lead.email+'.';setTimeout(()=>location.href='/admin/leads.html',1500)}catch(e){$('msg').textContent='Could not send: '+e.message}};init();</script></body></html>
