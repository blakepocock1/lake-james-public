<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Forecast | Lake James Canopies</title><link rel="stylesheet" href="/style.css"><style>body{background:#f4f4f2}.wrapx{max-width:1200px;margin:auto;padding:28px 5%}.panel{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:16px;border:1px solid #ddd;border-radius:10px}.metric b{font-size:28px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900;background:#eee}.RED{background:#ffd9d5}.YELLOW{background:#fff0bd}.GREEN{background:#dcf4df}.NEEDS_DATA{background:#e7e9ef}.LOW{background:#ffd9d5}.MEDIUM{background:#fff0bd}.HIGH{background:#dcf4df}.row{border-top:1px solid #eee;padding:14px 0}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div id="login" class="wrapx"><div class="panel"><h1>Project Forecasting</h1><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin" class="btn">Sign In</button><p id="loginerr"></p></div></div><main id="app" class="wrapx hidden"><div class="panel"><h1>Automatic Project Forecasting</h1><p>Projected field start and completion based on schedule slippage, material dates, crew assignments, and open field issues.</p></div><div id="metrics" class="grid"></div><div class="panel"><h2>Project Forecasts</h2><div id="list"></div></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij',{auth:{persistSession:true}}),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){const u=(await sb.auth.getUser()).data.user;if(!u)return;const p=await sb.from('profiles').select('role').eq('id',u.id).single();if(!['admin','manager','project_manager'].includes(p.data?.role)){await sb.auth.signOut();$('loginerr').textContent='Management access required.';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');const [c,f]=await Promise.all([sb.from('project_forecast_command_center').select('*').single(),sb.from('project_schedule_forecast').select('*').eq('record_type','PRODUCTION').order('quote_number')]);if(c.error||f.error)return alert((c.error||f.error).message);const x=c.data;$('metrics').innerHTML=[['Production',x.production_projects],['RED',x.red_forecasts],['YELLOW',x.yellow_forecasts],['Needs Data',x.needs_data_forecasts]].map(([a,b])=>`<div class="metric"><span>${a}</span><br><b>${b??0}</b></div>`).join('');$('list').innerHTML=(f.data||[]).map(r=>`<div class="row"><h3>${esc(r.quote_number||'')} — ${esc(r.quote_name||r.customer_name||'Project')}</h3><p><span class="badge ${esc(r.forecast_health)}">${esc(r.forecast_health)}</span> <span class="badge ${esc(r.forecast_confidence)}">${esc(r.forecast_confidence)} CONFIDENCE</span></p><p><b>Projected field start:</b> ${esc(r.projected_field_start||'—')} &nbsp; <b>Projected completion:</b> ${esc(r.projected_completion||'—')}</p><p><b>Risk drivers:</b> ${esc((r.risk_drivers||[]).join(' · ')||'None')}</p></div>`).join('')||'<p>No production projects yet.</p>'}$('signin').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)$('loginerr').textContent=r.error.message;else boot()};boot();</script></body></html>
