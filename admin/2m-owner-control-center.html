<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>$2M Owner Control Center | Lake James Canopies</title><link rel="stylesheet" href="/style.css"><style>body{margin:0;background:#f3f3f1}.shell{max-width:1450px;margin:auto;padding:24px}.hidden{display:none!important}.panel,.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin-bottom:14px}.top,.links{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.big{font-size:25px;font-weight:900}.muted{color:#666}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.action{font-size:19px;font-weight:900}.login{max-width:420px;margin:70px auto}.login input{width:100%;box-sizing:border-box;margin:5px 0;padding:9px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div id="login" class="panel login"><h1>Lake James Admin</h1><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin" class="btn">Sign In</button><p id="err"></p></div><main id="app" class="shell hidden"><div class="top"><div><b>LAKE JAMES CANOPIES</b><h1>$2M Owner Control Center</h1><p class="muted">One screen for the actions required to stay on the $2M path.</p></div><div class="links"><a class="btn secondary" href="/admin/5m-sales-engine.html">Sales</a><a class="btn secondary" href="/admin/5m-production-engine.html">Production</a><a class="btn secondary" href="/admin/5m-cash-plan.html">Cash</a><a class="btn secondary" href="/admin/13-week-plan.html">13-Week Plan</a><button id="refresh" class="btn secondary">Refresh</button><button id="signout" class="btn secondary">Sign Out</button></div></div><section class="grid" id="cards"></section><section class="panel"><h2>This Week's Owner Actions</h2><table class="table" id="actions"></table></section><section class="panel"><h2>$2M Operating Position</h2><table class="table"><tbody id="position"></tbody></table></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij',{auth:{persistSession:true}}),$=x=>document.getElementById(x),money=n=>n==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(+n),num=n=>n==null?'—':Number(n).toLocaleString(undefined,{maximumFractionDigits:1});$('signin').onclick=async()=>{let r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)$('err').textContent=r.error.message;else boot()};$('signout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refresh').onclick=load;async function boot(){let u=(await sb.auth.getUser()).data.user;if(!u)return;let p=await sb.from('profiles').select('role').eq('id',u.id).single();if(p.data?.role!=='admin'){await sb.auth.signOut();$('err').textContent='Administrator access required.';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}async function load(){let r=await sb.from('two_million_owner_control_center').select('*').single();if(r.error)return alert(r.error.message);let x=r.data;$('cards').innerHTML=`<div class="card"><div class="big">${money(x.annual_revenue_target)}</div><small>Annual Goal</small></div><div class="card"><div class="big">${money(x.monthly_revenue_required)}</div><small>Monthly Requirement</small></div><div class="card"><div class="big">${money(x.weekly_revenue_required)}</div><small>Weekly Requirement</small></div><div class="card"><div class="big">${money(x.bookings_week)}</div><small>Bookings This Week</small></div>`;$('actions').innerHTML=`<tr><td>Sales</td><td class="action">${x.sales_action}</td></tr><tr><td>Production</td><td class="action">${x.production_action}</td></tr><tr><td>Cash</td><td class="action">${x.cash_action}</td></tr>`;let rows=[['Current Backlog',money(x.current_backlog)],['Required Backlog',money(x.backlog_required)],['Current Open Pipeline',money(x.current_open_pipeline)],['Required Pipeline',money(x.pipeline_required)],['Leads Required / Week',num(x.leads_required_week)],['Leads This Week',num(x.leads_week)],['Proposals Required / Week',num(x.proposals_required_week)],['Proposals This Week',num(x.proposals_week)],['Wins Required / Week',num(x.wins_required_week)],['Wins This Week',num(x.wins_week)],['Field People Current',num(x.configured_people)],['Field People Required',num(x.field_people_required)],['Crews Required',num(x.crews_required)],['Fleet Assets',num(x.total_assets)],['Production Readiness Issues',num(x.production_readiness_issues)],['Open A/R',money(x.open_ar)],['Overdue A/R',money(x.overdue_ar)],['12-Week Net Cash',money(x.net_cash_12w)],['12-Week Cash Low Point',money(x.cash_low_point_12w)],['Working Capital Target',money(x.working_capital_target)]];$('position').innerHTML=rows.map(a=>`<tr><td><b>${a[0]}</b></td><td>${a[1]}</td></tr>`).join('')}boot();</script></body></html>
