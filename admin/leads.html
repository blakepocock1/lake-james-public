<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead Pipeline | Lake James Admin</title><link rel="stylesheet" href="/style.css"><style>.admin{max-width:1200px;margin:auto;padding:35px 5%}.login{max-width:430px;margin:80px auto}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat,.lead{background:#fff;border:1px solid #dce4ec;border-radius:12px;padding:16px}.stat b{display:block;font-size:28px}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}.lead{margin:12px 0}.leadtop{display:flex;justify-content:space-between;gap:15px}.badge{font-size:12px;font-weight:800;text-transform:uppercase}.muted{color:#687b8e}.notice{display:none;padding:10px;border-radius:8px;background:#e8f7ef}.error{background:#fdebea}.adminnav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 22px;padding:12px;background:#f4f7fa;border:1px solid #dce4ec;border-radius:10px}@media(max-width:750px){.stats{grid-template-columns:1fr 1fr}.leadtop{display:block}}</style></head><body><div id="login" class="login formbox"><h1>Lake James Admin</h1><p>Sign in to manage website leads.</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="signin" class="btn">Sign In</button><div id="loginerr" class="notice error"></div></div><main id="app" class="admin hidden"><div class="leadtop"><div><h1>Lake James Admin</h1><p class="muted">Leads, automatic quotes, master estimating, shop drawings and website management.</p></div><button id="signout" class="btn secondary">Sign Out</button></div><nav class="adminnav"><a class="btn" href="/admin/leads.html">Lead Pipeline</a><a class="btn secondary" href="/admin/price-book.html">Master Estimating System</a><a class="btn secondary" href="/admin/website.html">Website Manager</a></nav><div id="ok" class="notice"></div><div id="err" class="notice error"></div><div class="stats"><div class="stat"><span>Total Leads</span><b id="total">0</b></div><div class="stat"><span>New</span><b id="newCount">0</b></div><div class="stat"><span>Quoted</span><b id="quoted">0</b></div><div class="stat"><span>Won</span><b id="won">0</b></div></div><div class="toolbar"><select id="filter"><option value="all">All Leads</option><option value="new">New</option><option value="contacted">Contacted</option><option value="qualified">Qualified</option><option value="quoted">Quoted</option><option value="won">Won</option><option value="lost">Lost</option></select><button id="refresh" class="btn secondary">Refresh</button></div><div id="leads"></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij',{auth:{persistSession:true}}),$=x=>document.getElementById(x);let data=[],quotedLeadIds=new Set;const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function show(id,t){$(id).textContent=t;$(id).style.display='block';setTimeout(()=>$(id).style.display='none',4000)}async function boot(){let u=await sb.auth.getUser();if(!u.data.user)return;let p=await sb.from('profiles').select('role').eq('id',u.data.user.id).single();if(p.error||p.data?.role!=='admin'){await sb.auth.signOut();return show('loginerr','Internal admin access required.')}$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}$('signin').onclick=async()=>{let r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return show('loginerr',r.error.message);boot()};$('signout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refresh').onclick=load;$('filter').onchange=render;async function load(){let[r,q]=await Promise.all([sb.from('canopy_assessment_leads').select('*').order('created_at',{ascending:false}),sb.from('lead_quotes').select('lead_id')]);if(r.error)return show('err',r.error.message);data=r.data||[];quotedLeadIds=new Set((q.data||[]).map(x=>x.lead_id));render()}function render(){$('total').textContent=data.length;$('newCount').textContent=data.filter(x=>x.status==='new').length;$('quoted').textContent=data.filter(x=>x.status==='quoted').length;$('won').textContent=data.filter(x=>x.status==='won').length;let f=$('filter').value,rows=f==='all'?data:data.filter(x=>x.status===f);$('leads').innerHTML=rows.map(x=>`<article class="lead"><div class="leadtop"><div><h2>${esc(x.company_name||x.station_name||x.contact_name)}</h2><div class="muted">${esc(x.contact_name)} · <a href="mailto:${encodeURIComponent(x.email)}">${esc(x.email)}</a>${x.phone?' · '+esc(x.phone):''}</div><div class="muted">${esc(x.city||'')}${x.city&&x.state?', ':''}${esc(x.state||'')} · ${x.site_count||1} location${x.site_count===1?'':'s'} · ${esc((x.lead_type||'').replaceAll('_',' '))}</div></div><span class="badge">${esc(x.status)}</span></div>${x.issue_description?`<p>${esc(x.issue_description)}</p>`:''}<div class="actions"><a class="btn" href="/admin/quote.html?lead=${x.id}">Create / View Automatic Quote</a>${quotedLeadIds.has(x.id)?`<a class="btn secondary" href="/admin/drawing.html?lead=${x.id}">Open Shop Drawings</a>`:''}${['new','contacted','qualified','quoted','won','lost'].map(s=>`<button class="${x.status===s?'btn':'btn secondary'}" data-id="${x.id}" data-status="${s}">${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</div><div class="muted">Received ${new Date(x.created_at).toLocaleString()} · Source ${esc(x.source_page||'website')}</div></article>`).join('')||'<p>No leads in this stage.</p>';document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>setStatus(b.dataset.id,b.dataset.status))}async function setStatus(id,status){let r=await sb.from('canopy_assessment_leads').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return show('err',r.error.message);let x=data.find(y=>y.id===id);if(x)x.status=status;render()}(async()=>{let s=await sb.auth.getSession();if(s.data.session)boot()})();</script></body></html>
