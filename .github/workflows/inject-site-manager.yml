name: Wire Site Manager
on:
  push:
    branches: [main]
    paths:
      - 'site-manager.js'
      - '.github/workflows/inject-site-manager.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add site manager to every public HTML page
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' file; do
            case "$file" in
              ./admin/*) continue ;;
            esac
            if ! grep -q '/site-manager.js' "$file"; then
              perl -0pi -e 's#</body>#<script type="module" src="/site-manager.js"></script></body>#i' "$file"
            fi
          done < <(find . -type f -name '*.html' -print0)
      - name: Commit updated pages
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'All public pages already wired.'
            exit 0
          fi
          git config user.name 'lake-james-site-manager'
          git config user.email 'actions@users.noreply.github.com'
          git add '*.html' 'services/*.html' 'projects/*.html' 'locations/*.html' 'industries/*.html' 'campaigns/*.html' 2>/dev/null || true
          git commit -m 'Connect site manager to every public page'
          git push