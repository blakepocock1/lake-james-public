<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inspection Report | Lake James Canopies</title><link rel="stylesheet" href="/style.css"><style>body{margin:0;background:#eee;color:#171718;font-family:Arial,sans-serif}.hidden{display:none!important}.login,.controls{max-width:900px;margin:30px auto;background:#fff;padding:20px;border:1px solid #ddd;border-radius:12px}.report{width:8.5in;min-height:11in;margin:20px auto;background:#fff;box-sizing:border-box;padding:.55in;box-shadow:0 3px 20px #0002}.top,.row{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.brand{font-size:22px;font-weight:900}.muted{color:#666}.score{font-size:50px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.metric{border:1px solid #ddd;border-radius:8px;padding:10px;text-align:center}.metric b{display:block;font-size:22px}.metric small{font-size:9px;text-transform:uppercase}.section{margin-top:22px}.section h2{border-bottom:2px solid #222;padding-bottom:6px}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid #ddd;padding:8px 5px;text-align:left;font-size:11px;vertical-align:top}.table th{font-size:9px;text-transform:uppercase}.badge{display:inline-block;padding:3px 7px;border-radius:12px;background:#eee;font-size:9px;font-weight:800;text-transform:uppercase}.critical{background:#f7dada}.attention,.priority{background:#fff0bd}.good{background:#dff3e4}.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.photo img{width:100%;height:210px;object-fit:cover}.photo small{display:block;padding:4px}.summary{background:#f5f5f2;padding:14px;border-left:4px solid #222}.footer{margin-top:25px;border-top:1px solid #ccc;padding-top:10px;font-size:9px;color:#666}.controls select{min-width:350px;padding:10px}.controls .btn{margin:4px}@media(max-width:900px){.report{width:auto;margin:10px;min-height:0}.grid{grid-template-columns:repeat(2,1fr)}}@media print{body{background:#fff}.controls,.login{display:none!important}.report{width:auto;min-height:0;margin:0;box-shadow:none;padding:.35in}.section{break-inside:avoid}.photo{break-inside:avoid}@page{size:letter;margin:0}}</style></head><body><div id="login" class="login"><h1>Executive Inspection Reports</h1><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin" class="btn">Sign In</button><p id="loginerr"></p></div><div id="app" class="hidden"><div class="controls"><b>Lake James Canopies — Report Center</b><div class="row"><select id="inspection"></select><div><button id="load" class="btn">Build Report</button><button id="print" class="btn secondary">Print / Save PDF</button><button id="signout" class="btn secondary">Sign Out</button></div></div><p class="muted">Completed field inspections are converted into a customer-ready executive report.</p></div><article id="report" class="report hidden"></article></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';const sb=createClient('https://xiptoqvgpmxvoqrqlrbb.supabase.co','sb_publishable_3bhZUNlWY6ArDy0T72d0Yg_6bVY_Aij',{auth:{persistSession:true}}),$=x=>document.getElementById(x),e=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n||0)),date=v=>v?new Date(v).toLocaleDateString():'—';let user,profile,inspections=[],locations=[],orgs=[];async function boot(){user=(await sb.auth.getUser()).data.user;if(!user)return;const p=await sb.from('profiles').select('*').eq('id',user.id).single();if(p.error){return}profile=p.data;$('login').classList.add('hidden');$('app').classList.remove('hidden');await list()}$('signin').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)$('loginerr').textContent=r.error.message;else boot()};$('signout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('print').onclick=()=>window.print();async function list(){const [i,l,o]=await Promise.all([sb.from('inspections').select('*').eq('status','completed').order('inspected_at',{ascending:false}),sb.from('locations').select('*'),sb.from('organizations').select('id,name')]);if(i.error||l.error||o.error)return;inspections=i.data||[];locations=l.data||[];orgs=o.data||[];$('inspection').innerHTML=inspections.map(x=>{const l=locations.find(y=>y.id===x.location_id);return `<option value="${x.id}">${date(x.inspected_at)} — ${e(l?.location_code||'')} ${e(l?.name||'')}</option>`}).join('')}$('load').onclick=()=>build($('inspection').value);function badge(v){return `<span class="badge ${e(v)}">${e(v||'—')}</span>`}async function build(id){const inspection=inspections.find(x=>x.id===id);if(!inspection)return;const loc=locations.find(x=>x.id===inspection.location_id),org=orgs.find(x=>x.id===loc?.organization_id);const [c,p,is,cap]=await Promise.all([sb.from('inspection_checklist_items').select('*').eq('inspection_id',id).order('created_at'),sb.from('inspection_photos').select('*').eq('inspection_id',id).order('created_at'),sb.from('issues').select('*').eq('inspection_id',id).order('created_at'),sb.from('capital_plan_items').select('*').eq('inspection_id',id).order('target_date')]);const items=c.data||[],photos=p.data||[],issues=is.data||[],capital=cap.data||[],critical=issues.filter(x=>x.management_priority==='critical'),priority=issues.filter(x=>x.management_priority==='priority'),exposure=capital.filter(x=>!['completed','deferred'].includes(x.status)).reduce((a,x)=>a+Number(x.estimated_cost||0),0);let photoHtml='';for(const x of photos){const u=await sb.storage.from('inspection-photos').createSignedUrl(x.storage_path,3600);if(!u.error)photoHtml+=`<div class="photo"><img src="${e(u.data.signedUrl)}"><small>${e(x.caption||'Inspection photo')}</small></div>`}const metrics=[['Structure',inspection.structure_score],['Fascia',inspection.fascia_score],['Drainage',inspection.drainage_score],['Lighting',inspection.lighting_score],['Appearance',inspection.appearance_score]];const executive=critical.length?`${critical.length} critical condition${critical.length===1?'':'s'} require immediate attention. ${priority.length} additional priority item${priority.length===1?'':'s'} should be addressed within the planned maintenance window.`:priority.length?`No critical conditions were recorded. ${priority.length} priority item${priority.length===1?'':'s'} should be addressed through the planned maintenance program.`:'No critical or priority deficiencies were identified during this inspection. Continue routine monitoring and preventive maintenance.';$('report').innerHTML=`<header class="top"><div><div class="brand">LAKE JAMES CANOPIES</div><div class="muted">Facility Management · Canopy Condition Assessment</div></div><div style="text-align:right"><b>EXECUTIVE INSPECTION REPORT</b><br><small>${date(inspection.inspected_at)}</small></div></header><hr><div class="top"><div><h1>${e(org?.name||'Customer')}</h1><b>${e((loc?.location_code||'')+' '+(loc?.name||''))}</b><div class="muted">${e([loc?.address,loc?.city,loc?.state,loc?.postal_code].filter(Boolean).join(', '))}</div><p>Inspector: ${e(inspection.inspector_name||'Lake James Canopies')}</p></div><div style="text-align:center"><div class="score">${inspection.overall_score??'—'}</div><small>CANOPY HEALTH SCORE</small></div></div><div class="grid">${metrics.map(x=>`<div class="metric"><b>${x[1]??'—'}</b><small>${x[0]}</small></div>`).join('')}</div><section class="section"><h2>Executive Summary</h2><div class="summary">${e(executive)}<br><br><b>Current repair / capital exposure: ${money(exposure)}</b></div></section><section class="section"><h2>Condition Assessment</h2><table class="table"><thead><tr><th>Category</th><th>Inspection Item</th><th>Condition</th><th>Field Notes</th></tr></thead><tbody>${items.map(x=>`<tr><td>${e(x.category)}</td><td><b>${e(x.item)}</b></td><td>${badge(x.condition)}</td><td>${e(x.notes||'—')}</td></tr>`).join('')}</tbody></table></section><section class="section"><h2>Deficiencies & Recommended Action</h2>${issues.length?`<table class="table"><thead><tr><th>Priority</th><th>Deficiency</th><th>Recommendation / Detail</th><th>Target</th><th>Estimate</th></tr></thead><tbody>${issues.map(x=>`<tr><td>${badge(x.management_priority)}</td><td><b>${e(x.title)}</b></td><td>${e(x.description||'')}</td><td>${date(x.target_date)}</td><td>${money(x.estimate)}</td></tr>`).join('')}</tbody></table>`:'<p>No deficiencies were generated from this inspection.</p>'}</section><section class="section"><h2>Inspector Recommendations</h2><p>${e(inspection.recommendations||'Continue preventive inspection and maintenance according to the Lake James Canopies facility-management schedule.')}</p>${inspection.notes?`<p><b>Inspection notes:</b> ${e(inspection.notes)}</p>`:''}</section>${photoHtml?`<section class="section"><h2>Inspection Photo Record</h2><div class="photos">${photoHtml}</div></section>`:''}<section class="section"><h2>Capital Planning View</h2>${capital.length?`<table class="table"><thead><tr><th>Priority</th><th>Planned Item</th><th>Target</th><th>Budget Year</th><th>Estimated Cost</th></tr></thead><tbody>${capital.map(x=>`<tr><td>${badge(x.priority)}</td><td>${e(x.title)}</td><td>${date(x.target_date)}</td><td>${e(x.budget_year||'—')}</td><td>${money(x.estimated_cost)}</td></tr>`).join('')}</tbody></table>`:'<p>No capital items are currently associated with this inspection.</p>'}</section><footer class="footer">Prepared by Lake James Canopies · Facility Management Services<br>This report documents observed canopy conditions at the time of inspection and is maintained as part of the location's permanent facility history.</footer>`;$('report').classList.remove('hidden');window.scrollTo({top:$('report').offsetTop-10,behavior:'smooth'})}boot();</script></body></html>
